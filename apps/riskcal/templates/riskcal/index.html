{% extends "base.html" %}
{% load static %}
{% block title %}Risk and control calendar - TRAC{% endblock %}
{% block extra_head %}<link rel="stylesheet" href="{% static 'css/riskcal.css' %}">{% endblock %}

{% block content %}
<div class="riskcal-layout">
  <div id="riskcal">
    {% include "riskcal/_month.html" %}
  </div>
  {% include "riskcal/_work_panel.html" %}
</div>
<p id="riskcal-status" class="visually-hidden" role="status"></p>

<div class="modal fade" id="riskcal-modal" tabindex="-1" aria-labelledby="riskcal-modal-title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="riskcal-modal-title" tabindex="-1"></h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="riskcal-modal-body"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}<script src="{% static 'js/riskcal.js' %}" defer></script>{% endblock %}
