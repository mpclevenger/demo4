# MADE-UP TEST DATA: not the owner's questionnaire. A plausible shape for it, read with config/risk_questionnaire_map.json.
# Each question names the driver field it feeds, its wording, section and order, the kind of answer, and which
# answer (or number) switches the driver on. "weight" is a key the map does not name: it shows up as a note.
questionnaire:
  - field: RD01
    section: Access
    order: 10
    question: Does the application keep its own user accounts instead of using central sign-in?
    type: yes/no
    switches_on: yes
    help: Say yes if people can sign in with a password held by the application.
    weight: 3
  - field: RD02
    section: Data
    order: 20
    question: Does the team handle confidential client data?
    type: yes/no
    switches_on: yes
  - field: RD31
    section: Change
    order: 30
    question: Do automated tests run before every release?
    type: yes/no
    switches_on: "no"
    help: A no turns the driver on, because untested releases are the risk.
  - field: RD12
    section: Operations
    order: 40
    question: How many critical business processes does the team support?
    type: number
    switches_on: ">= 3"
  - field: RD14_pct
    section: Change
    order: 50
    question: What share of the team works on legacy platforms?
    type: share
    switches_on: "more than 40%"
    help: A rough share is fine.
  - field: RD41_days
    section: Operations
    order: 60
    question: How many days ago was the last disaster recovery test?
    type: number
    switches_on: "> 365"
