# The risk and control calendar: the event types and the events shown at /calendar/.
#
# To add an event, copy the commented example below to the end of the "events" list (remove "[]" from the
# "events:" line first), take off the # signs, and fill it in. Then run: .\trac.ps1 check
# The calendar shows the change on the next page load.
#
# Each event has these lines (the first three are needed):
#   title:    what the event is called
#   date:     the day, written YYYY-MM-DD (the first day, if it lasts several days)
#   type:     one of the keys under "types" below
#   end:      optional, the last day of an event that lasts several days
#   details:  optional, a few plain sentences; [link text](/guides/) makes a link
#   link:     optional, a TRAC page starting with / (like /guides/) or an https:// address
#   repeats:  optional, monthly, quarterly or annual
#   on:       optional, with "repeats: monthly": the same weekday each month, like "second thursday"
#             (first, second, third, fourth or last, then a weekday name). The date must be the first one.
#   until:    optional, the last day a repeating event can happen
# A repeating event on a day the month lacks (the 31st) falls on the last day of that month.
#
# Control due dates can also come from a spreadsheet saved as CSV: see content/calendar/control-dates.example.csv
# and "Control due dates from a spreadsheet" in MAINTAINING.md.
#
# events:
#   - title: Quarterly access review
#     date: 2027-01-15
#     end: 2027-01-31
#     type: control_due
#     details: Control owners finish the review and attach the evidence.
#     link: /guides/
#     repeats: quarterly
#     until: 2028-12-31
#
#   - title: Team meeting
#     date: 2027-01-14
#     type: meeting
#     repeats: monthly
#     on: second thursday
#
# The types list below can be changed: "key" is a short lowercase name used in events, "label" is the words
# people see. Each type gets its own color, in this order. Up to 8 types.

types:
  - key: control_due
    label: Control due
  - key: evidence_due
    label: Evidence due
  - key: review
    label: Review or audit
  - key: walkthrough
    label: Walkthrough period
  - key: meeting
    label: Meeting
  - key: deadline
    label: Deadline

events:
  - title: SOX working group
    date: 2026-12-03
    type: meeting

  - title: SOX working group
    date: 2027-01-14
    type: meeting
    repeats: monthly
    on: second thursday

  - title: Service account exclusion evidence run (during November)
    date: 2026-11-01
    type: evidence_due
    details: During November, Tech Risk runs the service account exclusion evidence and compiles the workbook, ready for control owners before the first change review of the year.
    link: /guides/service-account-exclusions-database-change-review/
    repeats: annual
