# Values we fill in later: a policy link, the Tech Risk email address, the walkthrough dates.
#
# How to fill one in: type it after "value:" and keep it in quotes. Leave "" while it isn't known yet.
# Pages show the real link or text once it is filled in, and "(to be added)" until then.
#
#   kind: link   a web address starting with https:// (or a TRAC page starting with /)
#   kind: email  an email address, like name@company.com
#   kind: text   plain words, like "Walkthrough period 1: Jan 4 to Jan 29"
#
# In content: write a link as [Access Control Policy](#todo-access-control-policy)
# (the key with dashes), or a word as {{tech_risk_email}} (the key with underscores).
# To add a new value, copy one entry, give it a new key, and run: .\trac.ps1 check

