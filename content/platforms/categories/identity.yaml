category: identity
intro: Directory and sign-in services that decide who a person is and what they can reach. The main risk
  is that whoever controls the directory controls every system that trusts it.
practices:
  Access: |
    - [Platform admins] Highly privileged roles and groups have few members, all named individuals.
    - [Platform admins] Privileged accounts are separate from everyday accounts and aren't used for email or browsing.
    - [Platform admins] Membership of privileged groups and roles is reviewed on the schedule the [Access Control Policy](#todo-access-control-policy) sets, and changes are approved by someone other than the requester.
    - [Platform admins] Joiner, mover and leaver processes disable or change accounts within the time the Access Control Policy sets, checked by comparing a complete HR list of leavers and movers with account dates.
    - [Platform admins] Accounts for vendors, contractors and guests have a sponsor and an end date, and unused accounts are disabled.
  Service accounts: |
    - [Platform users] Service accounts are listed with an owner, purpose and where they are used, and compared with the directory so unowned accounts are found.
    - [Platform users] Service accounts have no privileged group membership unless documented, and have long, rotated or managed passwords.
    - [Platform admins] Built-in and default accounts are renamed or disabled where possible.
  Change: |
    - [Platform admins] Changes to directory structure, policy, trusts and tenant settings go through change control with a record and an approval.
    - [Platform admins] Changes to privileged groups are compared with approved requests, so changes outside the process are found.
  Configuration: |
    - [Platform admins] The directory is set to a baseline covering password policy, multi-factor authentication, legacy authentication and trusts.
    - [Platform admins] A dated export of those settings is kept, and drift is checked on a schedule.
    - [Platform admins] Identity synchronization between systems is monitored and limited to the objects that need it.
  Logging: |
    - [Platform admins] Sign-in, directory change, group membership change and administrative role logs are collected into Splunk.
    - [Platform admins] Alerts fire for changes to privileged groups, new administrative role assignments and failed sign-in spikes.
    - [Platform admins] Administrators can't change or delete the logs that record their own actions, and an alert fires if the feed stops.
  Patching: |
    - [Platform admins] Directory servers and identity components are patched on the schedule your team has set, as are the servers used to administer them.
    - [Platform admins] Software past vendor support is on an approved plan or exception.
  Recovery: |
    - [Platform admins] The directory is backed up and a restore is tested on a schedule.
    - [Platform admins] A recovery plan exists for a damaged or encrypted directory.
    - [Platform admins] Emergency access accounts are protected, tested and monitored for any use.
  Data: |
    - [Platform admins] Directory data about people, groups and credentials is restricted to those who administer it.
    - [Platform admins] Attributes used for access decisions, such as department and manager, have an owner and a source of truth.
  Reports: |
    - [Platform users] User and group lists used in access reviews come straight from the directory with a visible run date, and the export settings are saved so the list can be produced again.
    - [Platform users] The count is compared with the directory, so no accounts are missing from the review. See [Reports used in controls](/guides/can-you-trust-the-report/).
  Network: |
    - [Platform admins] Administration is possible only from administration networks.
    - [Platform admins] Sign-in from outside the firm's network requires multi-factor authentication.
  Vendor: |
    - [Platform admins] Cloud identity services are on the vendor risk team's list, and the system owner reviews its assurance report each year (see the Reading a vendor's SOC report guide), including the controls the report expects the firm to run itself.
