category: network
intro: How people and systems reach the firm's systems, including remote access and network scanning.
  The main risk is that an unapproved path to a system exists, or that nobody would see someone using
  it.
practices:
  Access: |
    - [Platform admins] Network administration rights are held by named individuals with separate privileged accounts, and are reviewed on the schedule the [Access Control Policy](#todo-access-control-policy) sets.
    - [Platform admins] Remote access is granted to named users through approved groups, requires multi-factor authentication, and is removed when a person moves or leaves.
  Service accounts: |
    - [Platform admins] Accounts used by network devices and tools, such as scanning accounts, have an owner and purpose, the least access they need, and credentials held in a secret store.
  Change: |
    - [Platform admins] Firewall rules, routing and device configuration changes go through change control with a record, a reason and an approval.
    - [Platform admins] Firewall rules each have an owner and a business reason, and are reviewed on the schedule your team has set.
    - [Platform admins] Changes made outside change control are detected by comparing device configuration with the approved copy.
  Configuration: |
    - [Platform admins] Network devices and remote access gateways are set up to a baseline.
    - [Platform admins] A dated export of device configuration is kept, and drift is checked.
    - [Platform admins] Network diagrams show the paths into in-scope systems and are updated after changes.
  Logging: |
    - [Platform admins] Connection logs from remote access, firewalls and device administration are sent to Splunk.
    - [Platform admins] Alerts fire for sign-in anomalies, and when a device stops sending logs.
    - [Platform admins] Scan results are kept, with the date and the systems covered.
  Patching: |
    - [Platform admins] Network devices and remote access software are patched within the time your team has set (see [Timings your team sets](/guides/timings-your-team-sets/)).
    - [Platform admins] Vulnerability scanning covers all in-scope networks, compared against the asset inventory so systems are not missed.
    - [Platform admins] Unsupported firmware and software have an approved plan or exception.
  Recovery: |
    - [Platform admins] Device configurations are backed up, and a device can be replaced and restored from the backup.
    - [Platform admins] Remote access has a recovery plan that matches the BCP tier of the systems that depend on it, and a restore or failover test is recorded.
  Data: |
    - [Platform admins] Traffic that carries sensitive data is encrypted in transit.
    - [Platform admins] Logs and scan results hold sensitive detail and are limited to the people who need them.
  Reports: |
    - [Platform admins] Firewall rule and remote access exports used in reviews come from the device or its management console with a visible date, and include every rule rather than a filtered view.
  Network: |
    - [Platform admins] Segmentation separates user, server, administration and internet-facing networks, and rules between them are limited to what is needed.
    - [Platform admins] Administrative interfaces of network devices are reachable only from administration networks.
    - [Platform admins] Direct internet exposure of in-scope systems is documented and approved.
  Vendor: |
    - [Platform users] Providers of connectivity, remote access or managed network services are on the vendor risk team's list, and the system owner reviews their assurance reports (see the Reading a vendor's SOC report guide), including the controls the report expects the firm to run itself.
    - [Platform admins] Vendor access to network devices is approved, time-limited and logged.
