category: database
intro: Database engines and the data stores inside them. The main risk is that people or accounts change
  data or structure directly, bypassing the application and its controls, without anyone noticing.
practices:
  Access: |
    - [Platform admins] Administrative rights are held by a short list of named individuals, never shared accounts, using a separate privileged account. The list is reviewed on the schedule the [Access Control Policy](#todo-access-control-policy) sets.
    - [Platform admins] Developers and support staff have no standing write access to production data. Emergency (break-glass) access is time-limited, requested with a reason, logged and reviewed afterward.
    - [Platform users] Application users don't connect to the database directly with personal logins.
    - [Platform admins] Unused accounts are disabled after the period the Access Control Policy sets.
  Service accounts: |
    - [Platform users] Each application, job and integration has its own database account, with an owner and a listed purpose.
    - [Platform users] Service accounts have only the permissions they need, not broad roles such as `db_owner`.
    - [Platform users] Credentials are kept in a secret store and rotated.
    - [Platform users] Any exclusion of service accounts from a review population has a written reason.
  Change: |
    - [Platform users] Schema changes are written as scripts, reviewed by someone other than the author and deployed through a pipeline or change record. See the CI/CD pipelines as change control guide.
    - [Platform users] Direct data changes in production are treated as changes: requested, approved and logged.
    - [Platform users] Changes made outside the approved path are found by comparing audit records with the approved change list.
  Configuration: |
    - [Platform admins] Settings are documented against a baseline, covering authentication mode, encryption, auditing and enabled features.
    - [Platform admins] A dated export of those settings is kept, and drift is checked on a schedule.
    - [Platform admins] Default accounts and features that aren't needed are removed or turned off.
  Logging: |
    - [Platform admins] Auditing records logins, failed logins, permission and role changes, schema changes, and data changes on in-scope tables by people and administrator accounts.
    - [Platform admins] Audit records are written somewhere administrators can't change and collected into Splunk, using Splunk DB Connect where the audit data is in a database table.
    - [Platform admins] An alert fires when expected audit records don't arrive in Splunk.
    - [Platform users] Someone who isn't one of the administrators in the log reviews privileged activity on a schedule and follows up anything unexpected.
  Patching: |
    - [Platform admins] Database engines and their hosts are patched on the schedule your team has set.
    - [Platform admins] The version in use is within vendor support, and unsupported versions have an approved plan or exception.
  Recovery: |
    - Backups run on a schedule that supports the recovery point set by the system's BCP tier.
    - [Platform admins] Backups are encrypted, stored away from the server they protect and protected from deletion by database administrators.
    - [Platform users] A restore is tested on a schedule, with the date and result recorded.
    - [Platform admins] Failed backup jobs raise an alert that someone reads.
  Data: |
    - [Platform users] Data in each database is classified, and sensitive columns are known and protected at rest.
    - [Platform admins] Keys and certificates have named owners and are backed up separately so data can still be read after a rebuild.
    - [Platform users] Production data copied to test environments is masked or protected to the production level.
  Reports: |
    - [Platform users] Queries and extracts used as a control population or as evidence are saved, reviewed and kept under change control, not rewritten each time.
    - [Platform users] Each run keeps the query, the run date and a record count that ties back to the source table. See [Reports used in controls](/guides/can-you-trust-the-report/).
  Network: |
    - [Platform admins] Database ports are reachable only from application servers, administration networks and approved tools.
    - [Platform admins] Connections use encryption in transit.
  Vendor: |
    - [Platform admins] If the database is a managed service, the provider is on the vendor risk team's list, and the system owner reviews its assurance report each year (see the Reading a vendor's SOC report guide), including the controls the report expects the firm to run itself.
    - The review confirms which parts the provider runs and which the firm still owns, such as access, configuration and data.
