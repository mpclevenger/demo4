category: cloud
intro: Cloud accounts, subscriptions, container platforms and managed data platforms where the firm runs
  workloads. The main risk is that one misconfigured permission or setting exposes many systems at once.
practices:
  Access: |
    - [Platform admins] Administrator access is granted to named individuals through the central identity provider with multi-factor sign-in, not through local users created in the cloud account.
    - [Platform admins] Day-to-day work uses least-privilege roles. Administrator roles are time-limited or approved on request, and are reviewed on the schedule the [Access Control Policy](#todo-access-control-policy) sets.
    - [Platform admins] Root or owner credentials are locked away, protected by multi-factor authentication and monitored for any use.
    - [Platform admins] Access is removed when a person moves or leaves. Vendor and partner access has an end date.
  Service accounts: |
    - [Platform users] Workloads use roles or managed identities with temporary credentials, rather than long-lived keys.
    - [Platform users] Where long-lived keys exist, each has an owner, is rotated, and is stored in a secret store.
    - [Platform users] A list of workload identities and their permissions is kept and reviewed on the schedule the Access Control Policy sets.
  Change: |
    - [Platform users] Infrastructure is defined as code, reviewed by someone other than the author and applied through a pipeline. See the Infrastructure as code guide.
    - [Platform admins] Changes made in the console are blocked for production or detected, and each is followed up.
    - [Platform admins] The deployment identity makes production changes; people have read access by default.
  Configuration: |
    - [Platform admins] Accounts and subscriptions sit under one organization structure, each with a recorded owner, purpose and BCP tier.
    - [Platform admins] They follow a baseline, and guardrails prevent unsafe settings such as public storage.
    - [Platform admins] A dated report of resources against the baseline is kept, and findings are tracked to closure.
  Logging: |
    - [Platform admins] Administrative activity logs are on in every account and subscription, and sent to Splunk.
    - [Platform admins] Log storage is protected from deletion by the account's own administrators.
    - [Platform admins] An alert fires when logging is turned off or the feed stops, and new accounts are added to logging when created.
  Patching: |
    - [Platform users] Hosts and images that the firm manages are scanned and patched within the time your team has set (see [Timings your team sets](/guides/timings-your-team-sets/)).
    - [Platform admins] The review separates what the provider patches from what the firm patches, and the firm's part is covered.
  Recovery: |
    - [Platform admins] Data and configuration are backed up to meet the BCP tier, with copies in another region or account where the tier requires.
    - [Platform users] Infrastructure can be rebuilt from code, and a restore is tested and recorded.
  Data: |
    - [Platform users] Data stored in the cloud is classified, encrypted, and kept in approved regions.
    - [Platform users] Storage that holds sensitive data is not public, and this is checked.
    - [Platform admins] Encryption keys have named owners, and who can use or delete them is limited.
  Reports: |
    - [Platform users] Dashboards and extracts from cloud and data platforms used in a key control keep their logic in reviewed, version-controlled definitions and run with each viewer's own permissions.
    - [Platform users] Sharing, scheduled emails and downloads of those reports are limited to the people who need them. See [Reports used in controls](/guides/can-you-trust-the-report/).
  Network: |
    - [Platform users] Workloads sit in private networks, and exposure to the internet is by exception and approved.
    - [Platform admins] Security groups and network rules are limited to the ports and sources needed, and are reviewed on the schedule your team has set.
    - [Platform admins] Connections to the firm's on-premises network use approved, encrypted links.
  Vendor: |
    - [Platform users] The cloud provider is on the vendor risk team's list, and the system owner reviews its assurance report (see the Reading a vendor's SOC report guide), including the controls the report expects the firm to run itself.
    - [Platform users] The review lists what the provider covers and what the firm must do itself, under the shared responsibility model, and shows the firm does its part.
