# Controls and risks for the Platforms and infrastructure topic, one entry per TRAC ID.
# The format (every field and what it means) is described in content/controls/README.md.
# After editing, check the file with .\trac.ps1 check (it changes nothing).

topic: Platforms and infrastructure

risks:
  - id: R-PI-01
    title: Servers are set up inconsistently or insecurely
    statement: >-
      A server, database instance or cluster is built or configured in a way that is weaker than intended.
      This can happen when there is no agreed baseline, or each build is done by hand. The result could be
      exposure to attack or unreliable behavior across the systems that run on it.
    owned_by: Head of Engineering
    stage: Configure and evidence
    in_sox_scope: yes
    covered_by:
      - control: PI-01
        coverage: full
        why: A documented baseline defines the intended settings, and new servers are built to it.
      - control: PI-02
        coverage: partial
        why: Finds servers that no longer match the baseline.

  - id: R-PI-02
    title: Configuration drifts away from the approved setup
    statement: >-
      Settings on a server, database instance or cluster change over time without an approved request.
      This can happen when administrators make direct changes and nothing compares the live settings to
      the baseline. The result could be weakened security or changed behavior, with no record of who changed
      what or why.
    owned_by: Head of Engineering
    stage: Monitor drift
    in_sox_scope: yes
    covered_by:
      - control: PI-02
        coverage: full
        why: Live settings are compared to the baseline on a schedule, and each difference is approved or fixed.
      - control: PI-01
        coverage: partial
        why: The baseline gives a clear definition of what should be set.

controls:
  - id: PI-01
    title: Servers are built to a documented baseline
    why: >-
      A written baseline says what a correctly set up server, database instance or cluster looks like.
      Without one, every build is a judgment call, two servers doing the same job end up different, and
      there is nothing to check drift against later.
    applies_when:
      - The team builds or manages Windows servers, SQL Server instances, Kubernetes clusters or cloud accounts.
      - The team runs a directory, an engineering tool or a logging platform whose settings protect in-scope systems.
    nature: preventive
    method: manual
    frequency: annual
    level: supporting
    owned_by: Head of Engineering
    performed_by: Platform engineer
    reviewed_by: Control owner
    stage: Configure and evidence
    categories: [operating_system, database, cloud, network, identity, engineering_tools, logging]
    steps:
      - do: List the kinds of server and platform you run.
        how: >-
          Pull the servers, instances, clusters and cloud accounts from the systems that know about them,
          such as the directory and the cloud organization, then group them by kind, for example web
          servers, SQL Server instances or a cluster. Each kind gets one baseline, so a server that fits no
          group has no baseline.
        evidence:
          keep: The list of servers and platforms, each mapped to a kind
          shows:
            - The date and the source each part of the list came from
            - Every in-scope server or platform mapped to a kind, or a reason it isn't
        commands:
          - platform: Active Directory
            note: Every server computer object in the domain.
            code: |
              Get-ADComputer -Filter 'OperatingSystem -like "*Server*"' -Properties OperatingSystem, LastLogonDate |
                Select-Object Name, OperatingSystem, LastLogonDate
          - platform: AWS
            note: Every account in the AWS organization. Run from the management account or a delegated administrator.
            code: |
              aws organizations list-accounts --query "Accounts[].[Id,Name,Status]" --output table
      - do: Write the baseline for each kind.
        how: >-
          Start from the vendor's security guidance, adjust it to the firm, and record the
          reason for each difference. Cover security settings, services, local accounts and administrator
          groups, logging and patch level; for a directory, engineering tool or logging platform, cover the
          settings that protect the systems relying on it. Writing it as code (Group Policy, Terraform,
          Kubernetes manifests, AWS Config rules, Azure Policy) means the baseline is also the drift check.
        evidence:
          keep: The baseline for each kind, with its version
          shows:
            - The version, the date and who approved it
            - Each difference from vendor guidance with its reason
      - do: Build from the baseline.
        how: >-
          New servers come from a template or automation, not by hand from memory. A difference needed at build
          time is approved and recorded as an exception, and an export of the applied settings shows the build
          matched.
        evidence:
          keep: The build record and an export of the applied settings
          shows:
            - The server, the date it was built and the template or baseline version used
            - Any approved exception
        commands:
          - platform: Windows Server
            note: The Group Policy applied to a server, as an HTML report, and its installed updates. Replace <server>.
            code: |
              gpresult /s <server> /scope computer /h C:\Temp\<server>-gpresult.html
              Get-HotFix -ComputerName <server> | Sort-Object InstalledOn
          - platform: SQL Server
            note: The instance's configuration settings, to compare with the baseline.
            code: |
              SELECT name, value, value_in_use
              FROM sys.configurations
              ORDER BY name;
      - do: Review it regularly.
        how: >-
          The platform owner and someone outside the build team review each baseline, and again when the
          vendor guidance or the platform changes. They check that exceptions are still needed.
        evidence:
          keep: The dated review of each baseline
          shows:
            - Who reviewed it, when, and the version they looked at
            - What changed and which exceptions were kept or closed
      - do: Check it on each platform.
        checks:
          - platform: Windows Server
            audience: Platform admins
            where: The Group Policy report for a sample of servers (gpresult), and the baseline for the server kind.
            good:
              - Each in-scope server is mapped to a baseline.
              - The applied settings match the baseline, apart from approved exceptions.
              - Each exception has a reason and an approver.
            keep: The applied-settings report for the sampled servers
            shows:
              - The server names and the date
              - The baseline version compared
          - platform: SQL Server
            audience: Platform admins
            where: The instance's configuration settings (sys.configurations), next to the baseline for SQL Server instances.
            good:
              - Each in-scope instance has a baseline.
              - Settings in use match the baseline, apart from approved exceptions.
            keep: The configuration export for the sampled instances
            shows:
              - The instance names and the date
              - The baseline version compared
          - platform: Active Directory
            audience: Platform admins
            where: The baseline for domain controllers and the directory's security settings, next to the live settings.
            good:
              - The baseline names who approved it and when.
              - Domain controller settings match it, apart from approved exceptions.
            keep: The baseline and the settings export
            shows:
              - The domain and the date
              - The baseline version
          - platform: AWS
            audience: Platform admins
            where: AWS Config rules and the organization's account list.
            good:
              - Every in-scope account is listed with an owner.
              - The baseline is written as rules or code, with a version.
              - New accounts start with the baseline applied.
            keep: The account list and the rules that hold the baseline
            shows:
              - The organization and the date
              - The rule or code version
          - platform: Azure
            audience: Platform admins
            where: Azure Policy assignments for each in-scope subscription.
            good:
              - Each in-scope subscription has the baseline policies assigned.
              - The baseline is held as code with a version and an approver.
            keep: The policy assignments for each subscription
            shows:
              - The subscriptions covered and the date
              - The baseline version
          - platform: Kubernetes
            audience: Platform admins
            where: The baseline manifests and the cluster's settings, on any cloud or the firm's own servers.
            good:
              - Each in-scope cluster is listed with where it runs.
              - Cluster settings follow the stored baseline manifests, with approved exceptions only.
            keep: The baseline manifests and the cluster settings
            shows:
              - The cluster and where it runs
              - The baseline version
          - platform: Splunk
            audience: Platform admins
            where: The Splunk Cloud settings that protect log data, meaning who can administer it, and what is kept.
            good:
              - A baseline names the settings that matter, such as administrator roles and log retention.
              - The live settings match it, apart from approved exceptions.
            keep: The baseline and a settings export
            shows:
              - The date and the Splunk Cloud stack
              - The baseline version
    choosing_people:
      performer:
        - Builds and runs the platform and knows which settings matter on it
        - Can read vendor guidance and explain why the firm differs
      reviewer:
        - Isn't the person who wrote the baseline
        - Understands the platform's security settings well enough to question a weak one
      small_team: If one engineer runs the platform, have someone from a team that runs a similar platform read the baseline.

  - id: PI-02
    title: Configuration drift is monitored
    why: >-
      Servers change after they're built: a quick fix, a new administrator, a setting switched off while
      troubleshooting. Comparing live settings with the baseline finds those changes before they weaken
      security or hide a different problem, and gives every difference an owner.
    applies_when:
      - The team runs servers, database instances or clusters whose settings could affect security or data.
      - The team runs a directory, an engineering tool or a logging platform whose settings protect in-scope systems.
    nature: detective
    method: it_dependent
    frequency: monthly
    level: non-key
    owned_by: Head of Engineering
    performed_by: Platform engineer
    reviewed_by: Control owner
    stage: Monitor drift
    categories: [operating_system, database, cloud, network, identity, engineering_tools, logging]
    steps:
      - do: List what the comparison must cover.
        how: >-
          Use the same list as the baseline in "Servers are built to a documented baseline", and compare it
          with what the drift tool actually checks. A server the tool doesn't know about is silently skipped,
          so every gap needs to be closed or explained.
        evidence:
          keep: The coverage list
          shows:
            - The date and the sources compared
            - Every in-scope item covered by the tool, or a reason it isn't
      - do: Compare servers and databases with the baseline.
        how: >-
          Export the live settings from each server and instance and compare them with its baseline, by a tool
          where possible. Local administrator groups deserve their own check, because a quietly added
          administrator undoes most other settings.
        evidence:
          keep: The comparison output
          shows:
            - The date and the servers and instances it covered
            - Each difference found
        commands:
          - platform: Windows Server
            note: The Group Policy applied to a server, and who is in its local Administrators group. Replace <server>.
            code: |
              gpresult /s <server> /scope computer /h C:\Temp\<server>-gpresult.html
              Invoke-Command -ComputerName <server> { Get-LocalGroupMember -Group Administrators }
          - platform: SQL Server
            note: The instance's live settings, to compare with the baseline export.
            code: |
              SELECT name, value_in_use
              FROM sys.configurations
              ORDER BY name;
      - do: Compare cloud accounts and clusters with the baseline.
        how: >-
          Where the baseline is written as cloud rules or manifests, the platform compares for you: AWS Config
          and Azure Policy report what doesn't match, and Kubernetes can show the difference between the live
          cluster and the stored manifests.
        evidence:
          keep: The compliance or difference report
          shows:
            - The date and the account, subscription or cluster it covered
            - Each resource that doesn't match, with the rule it breaks
        commands:
          - platform: AWS
            note: Config rules with resources that don't match. Run per account and region.
            code: |
              aws configservice describe-compliance-by-config-rule --compliance-types NON_COMPLIANT
          - platform: Azure
            note: Policy compliance for a subscription. Replace <subscription-id>.
            code: |
              az policy state summarize --subscription <subscription-id>
          - platform: Kubernetes
            note: Differences between the live cluster and the baseline manifests; changes nothing. Replace <baseline-folder>.
            code: |
              kubectl diff -R -f <baseline-folder>/
      - do: Set how often you compare, and alert on the settings that matter most.
        how: >-
          Write the comparison cycle in your procedure. Changes to the most important settings, such as
          administrator group membership, can raise an alert between comparisons.
        weigh:
          - How quickly an unapproved change could do harm on this platform
          - Whether a tool can compare settings continuously
          - How much of the platform changes between comparisons
          - The BCP tier of the systems that run on it
        commands:
          - platform: Splunk
            note: Members added to global, local and universal security groups, from Windows Security logs. Replace <windows-index>.
            code: |
              index=<windows-index> EventCode IN (4728, 4732, 4756)
              | stats count by host, EventCode
      - do: Resolve each difference.
        how: >-
          Each difference is matched to an approved change, in which case the baseline is updated, or set back
          to the baseline. An unexplained difference is investigated through the change and access logs to
          find who changed it and why, and the outcome is recorded.
        evidence:
          keep: The list of differences for the period, with the outcome of each
          shows:
            - The period and a count that matches the comparison output
            - For each difference, the approved change it matched or the fix, and who decided
      - do: Review it regularly.
        how: >-
          Someone who doesn't administer the platform checks that the comparison covered everything in scope,
          every difference was resolved, and repeat differences led to a fix in the baseline or the build.
        evidence:
          keep: The dated review
          shows:
            - Who reviewed it, when, and the period covered
            - Anything unresolved and what was done about it
      - do: Check it on each platform.
        checks:
          - platform: Windows Server
            audience: Platform admins
            where: The comparison output for each server kind, and the local Administrators group of a sample of servers.
            good:
              - The comparison covered every in-scope server on the coverage list.
              - Each difference has an approved change or a fix.
              - Every local administrator is a named person or approved group.
            keep: The comparison output and the outcome of each difference
            shows:
              - The period covered and the server count
              - Who decided each outcome
          - platform: SQL Server
            audience: Platform admins
            where: The live settings export for each instance, compared with its baseline export.
            good:
              - Every in-scope instance was compared.
              - Each difference has an approved change or a fix.
            keep: The comparison output and the outcome of each difference
            shows:
              - The period covered and the instance count
              - Who decided each outcome
          - platform: Active Directory
            audience: Platform admins
            where: The comparison of domain controller and directory settings with the baseline, and changes to privileged groups.
            good:
              - Privileged group changes match approved requests.
              - Each setting difference has an approved change or a fix.
            keep: The comparison output and the outcome of each difference
            shows:
              - The period covered and the domain
              - Who decided each outcome
          - platform: AWS
            audience: Platform admins
            where: AWS Config compliance for each in-scope account and region.
            good:
              - Every in-scope account is covered.
              - Each non-compliant resource has a fix or an approved exception.
            keep: The compliance report and the outcome of each finding
            shows:
              - The accounts and regions covered, and the date
              - Who decided each outcome
          - platform: Azure
            audience: Platform admins
            where: Azure Policy compliance for each in-scope subscription.
            good:
              - Every in-scope subscription is covered.
              - Each non-compliant resource has a fix or an approved exception.
            keep: The compliance report and the outcome of each finding
            shows:
              - The subscriptions covered and the date
              - Who decided each outcome
          - platform: Kubernetes
            audience: Platform admins
            where: The difference between each cluster and its stored manifests.
            good:
              - Every in-scope cluster is compared.
              - Each difference was set back or its manifest was updated through change control.
            keep: The difference output and the outcome of each one
            shows:
              - The cluster, where it runs and the date
              - Who decided each outcome
          - platform: Splunk
            audience: Platform admins
            where: Splunk searches or alerts on changes to the settings that matter most, such as administrator roles.
            good:
              - An alert exists for each most-important setting.
              - Each alert in the period has a record of what happened.
            keep: The alert list and the record for each alert
            shows:
              - The period covered and the Splunk Cloud stack
    choosing_people:
      performer:
        - Runs the platform and the drift tool
        - Can tell an approved change from an unexplained one by checking the change records
      reviewer:
        - Doesn't administer the servers or platform being compared
        - Can read the comparison output and the change records directly
      small_team: If the same people administer and compare, have the platform team of another platform look at the differences and their outcomes.
