# Controls and risks for the "IT disaster recovery" topic, one entry per TRAC ID.
# The format is described in content/controls/README.md.
# Check the file after editing with .\trac.ps1 check

# This topic covers IT disaster recovery only: getting systems and data back.
# How the business keeps operating (business continuity) belongs to the BCP team.

topic: IT disaster recovery

risks:
  - id: R-DR-01
    title: Data can't be recovered after loss or corruption
    statement: >-
      Data or configuration on a system is lost or damaged and there is no usable copy to restore. This
      can happen when backups are missing, set up to the wrong need, or failing without anyone noticing.
      The result could be permanent loss of financial or customer data, or long outages while the data is
      rebuilt.
    owned_by: Application owner
    stage: Back up and restore
    in_sox_scope: yes
    covered_by:
      - control: DR-01
        coverage: full
        why: Backups are set up to the system's needs, and failures are watched for and fixed.
      - control: DR-02
        coverage: partial
        why: Proves the copies can actually be restored, not just that a job ran.
      - control: DR-03
        coverage: partial
        why: Describes how to use the copies to bring the system back.

  - id: R-DR-02
    title: Backups exist but can't be restored
    statement: >-
      A backup is taken but turns out to be incomplete, corrupt or unusable when it is needed. This can
      happen when restores are never tried or the backup does not include everything the system needs.
      The result could be an outage that lasts far longer than planned, with data permanently lost.
    owned_by: Application owner
    stage: Back up and restore
    in_sox_scope: yes
    covered_by:
      - control: DR-02
        coverage: full
        why: A restore is tried on a schedule and gaps are fixed and recorded.
      - control: DR-01
        coverage: partial
        why: Backup success is monitored, which catches many problems before a restore is needed.

  - id: R-DR-03
    title: A serious outage has no tested way back
    statement: >-
      A critical system fails or its site is lost and the team does not know the order of steps, the people
      or the targets for getting it back. This can happen when the recovery plan is missing, out of date or
      never exercised. The result could be a long outage of tier 0 or tier 1 systems, missed financial
      reporting and delayed decisions during the event.
    owned_by: Head of Engineering
    stage: Test recovery
    in_sox_scope: yes
    covered_by:
      - control: DR-03
        coverage: full
        why: A written plan is kept current and exercised for the most critical systems.
      - control: DR-02
        coverage: partial
        why: Restore results show whether the plan's time and data-loss targets are realistic.

  - id: R-DR-04
    title: Backups are read or changed by the wrong people
    statement: >-
      Backup copies are viewed, altered or deleted by people who do not need that access. This can happen
      when backup storage is open to many administrators or shares permissions with the live system. The
      result could be leaked data, or the only good copy being destroyed or tampered with.
    owned_by: Head of Engineering
    theme: Backup access
    in_sox_scope: yes
    covered_by:
      - control: DR-04
        coverage: full
        why: Only named people and tools can reach backups, and what they do is logged and reviewed.

controls:
  - id: DR-01
    title: Backups match the system's needs and are monitored
    why: >-
      A backup that was never set up for what the system needs, or that fails quietly, is no protection,
      and the team finds out during the outage. Setting backups from the system's recovery needs and
      watching every result means a failure is fixed while there is still a good copy to fall back on.
    applies_when:
      - The system holds data or configuration that would be hard or impossible to recreate.
    nature: detective
    method: it_dependent
    frequency: daily
    level: key
    owned_by: Application owner
    performed_by: Backup administrator
    reviewed_by: Control owner
    stage: Back up and restore
    categories: [application, database, operating_system, cloud, jobs]
    steps:
      - do: List what each system needs to recover.
        how: >-
          For each system, record the data, the configuration, the means to rebuild it (such as
          infrastructure code or images) and any keys or certificates needed to read the backups. A perfect
          backup is useless if the key to decrypt it was on the server that failed.
        evidence:
          keep: The backup scope for each system
          shows:
            - The date and the system's BCP tier
            - Each item needed to recover, and how it is backed up
      - do: Set how often to back up and how long to keep copies.
        how: >-
          Write the schedule and retention for each system in your procedure, and keep copies somewhere a
          failure of the live system wouldn't also destroy, such as another account, region or storage.
          The BCP tier sets the RPO (recovery point objective: how much recent data the business can afford
          to lose), and the schedule has to meet it.
        weigh:
          - The RPO that comes with the system's BCP tier
          - How quickly the data changes, and whether it can be re-entered or rebuilt
          - How much load or downtime a backup causes
        evidence:
          keep: The schedule and retention for each system
          shows:
            - Who agreed it and when
            - How it meets the RPO for the system's tier
      - do: Set up the backups and list the jobs.
        how: >-
          Configure the backups, then pull the job list from the backup tool itself to show every system in
          scope has one. Changes to the schedule go through change control.
        evidence:
          keep: The backup job list
          shows:
            - The date and the tool it came from
            - A job for every system in scope, with its schedule
        commands:
          - platform: SQL Server
            note: Every database with its latest full, differential and log backup.
            code: |
              SELECT d.name, d.recovery_model_desc,
                     MAX(CASE WHEN b.type = 'D' THEN b.backup_finish_date END) AS last_full,
                     MAX(CASE WHEN b.type = 'I' THEN b.backup_finish_date END) AS last_diff,
                     MAX(CASE WHEN b.type = 'L' THEN b.backup_finish_date END) AS last_log
              FROM sys.databases AS d
              LEFT JOIN msdb.dbo.backupset AS b ON b.database_name = d.name
              GROUP BY d.name, d.recovery_model_desc
              ORDER BY d.name;
          - platform: AWS
            note: The AWS Backup plans in the account, then the resources that have been backed up.
            code: |
              aws backup list-backup-plans
              aws backup list-protected-resources
          - platform: Azure
            note: Items protected in a Recovery Services vault; replace <rg> and <vault>.
            code: |
              az backup item list --resource-group <rg> --vault-name <vault> --output table
      - do: Make failures visible, and set how fast they're fixed.
        how: >-
          Every backup result is checked, by an alert to a queue someone watches, with cover. A backup that
          never started counts as a failure too. Write the response time in your procedure.
        weigh:
          - How much data is unprotected in the meantime, compared with the RPO
          - Whether the next scheduled backup would close the gap on its own
          - Who can fix it out of hours
          - Whether the backup tool alerts on a missed run, or only on a failed one
        evidence:
          keep: The alert settings and the jobs they cover
          shows:
            - The date
            - That every backup job is covered, including missed starts
      - do: Record every failure.
        how: >-
          Each failed or missed backup becomes a ticket with the cause, the fix and the date of the next
          good backup.
        evidence:
          keep: The failed backups for the period, and the ticket for each
          shows:
            - The period, and a count that matches the backup tool's own history
            - For each failure, the cause, the fix and the next good backup
        commands:
          - platform: SQL Server
            note: >-
              Backups taken since a date. msdb records only successful backups, so a missing one means a
              failure or a miss; check the backup job's history for the error. Replace the date.
            code: |
              SELECT database_name, type, backup_start_date, backup_finish_date
              FROM msdb.dbo.backupset
              WHERE backup_start_date >= '2027-01-01'
              ORDER BY database_name, backup_start_date;
          - platform: AWS
            note: Failed AWS Backup jobs created since a date; replace the date.
            code: |
              aws backup list-backup-jobs --by-state FAILED --by-created-after 2027-01-01T00:00:00Z
          - platform: Azure
            note: Failed backup jobs in a vault since a date (day-month-year); replace <rg>, <vault> and the date.
            code: |
              az backup job list --resource-group <rg> --vault-name <vault> --status Failed --start-date 01-01-2027 --output table
      - do: Review it regularly.
        how: >-
          Someone other than the backup administrator checks that every in-scope system still has a backup
          job, so one that was added or changed isn't left out, that failures were fixed in time, and that
          schedules still meet each system's tier.
        evidence:
          keep: The dated review
          shows:
            - Who reviewed it, when, and the period they looked at
            - The systems list and job list compared, and each gap with what was decided
      - do: Check it on each platform.
        how: >-
          For each platform this control applies to, this says where to look, what good looks like and what to
          keep. Platform admins run the platform; Platform users use it for their own systems.
        checks:
          - platform: SQL Server
            audience: Platform admins
            where: SQL Server Agent, then Jobs and Alerts, for the backup jobs, or the query for this platform.
            good:
              - Every database has a backup job, including new ones.
              - A failed or missed backup alerts an operator and the address is a queue someone watches.
              - Backups go to a location the database administrators cannot delete from.
            keep: A dated export of the backup jobs and their alerts
            shows:
              - The instance and the date
              - Each database with its schedule
          - platform: SQL Server
            audience: Platform users
            where: The query for this platform, for the databases your team owns.
            good:
              - The latest full, differential and log backups for each database fit the data loss your tier allows.
              - Every failed backup in the period has a ticket with the cause, the fix and the next good backup.
            keep: The latest backups for each database and the tickets for failures
            shows:
              - The period covered and the instance
              - For each failure, the cause and the fix
          - platform: Windows Server
            audience: Platform admins
            where: Windows Server Backup, or the backup tool's console, for each server in scope.
            good:
              - Every in-scope server has a backup job with a recent good result.
              - Keys and certificates needed to read the backups are held separately.
            keep: The backup job list and the latest result for each server
            shows:
              - The date and the tool it came from
          - platform: Active Directory
            audience: Platform admins
            where: The backup tool's job list for the domain controllers, including system state.
            good:
              - At least one domain controller in each domain has a recent good system state backup.
              - A failed backup raises an alert that someone reads.
            keep: The backup job list and latest result for the domain controllers
            shows:
              - The date and the domains covered
          - platform: AWS
            audience: Platform admins
            where: AWS Backup, then Backup plans, or the commands for this platform.
            good:
              - Resources are assigned to a backup plan through tags or selections, so new ones are included.
              - Failed and missed jobs raise an alert to a queue someone watches.
              - Copies go to another account or region.
            keep: The dated list of backup plans and protected resources
            shows:
              - The account and the date
          - platform: AWS
            audience: Platform users
            where: AWS Backup, then Protected resources, in your team's account.
            good:
              - Every resource that holds your data is protected, and the schedule meets the data loss your tier allows.
              - Every failed backup job in the period has a ticket with the cause and the fix.
            keep: The protected resources and the failed jobs for the period, with tickets
            shows:
              - The period covered and the account
          - platform: Azure
            audience: Platform admins
            where: The Recovery Services vault, then Backup items and Alerts, or the commands for this platform.
            good:
              - Backup alerts reach a queue someone watches.
              - The vault's copies are stored away from the resources they protect.
            keep: A dated export of the vault's policies and alert settings
            shows:
              - The vault and the date
          - platform: Azure
            audience: Platform users
            where: The Recovery Services vault, then Backup items, in your team's subscription.
            good:
              - Every in-scope resource shows as protected with a recent good result.
              - Every failed job in the period has a ticket with the cause and the fix.
            keep: The backup items and failed jobs for the period, with tickets
            shows:
              - The period covered and the subscription
          - platform: Databricks
            audience: Platform users
            where: The storage the workspace's tables live in (for example S3), and the repository that holds your code.
            good:
              - Your team's key tables are protected by versioning, replication or a copy elsewhere.
              - Notebooks and job definitions are kept in a repository and not only in the workspace.
            keep: A dated list of the tables and code that need recovery, and how each is protected
            shows:
              - The workspace and the date
          - platform: Kubernetes
            audience: Platform admins
            where: The cluster's backup tool and its backup of the cluster state (etcd).
            good:
              - The cluster state is backed up, with a recent good result.
              - The backup is stored outside the cluster.
            keep: The backup list and the latest result for each cluster
            shows:
              - The cluster and where it runs, and the date
          - platform: GitHub Enterprise Server
            audience: Platform admins
            where: The backup host's job list and latest snapshot.
            good:
              - A recent good snapshot exists on a host other than the appliance.
              - A failed snapshot raises an alert that someone reads.
            keep: The snapshot list and latest result
            shows:
              - The appliance and the date
          - platform: In-house job scheduler
            audience: Platform admins
            where: The scheduler's backup job, or the repository that holds its job definitions.
            good:
              - Job definitions and schedules can be rebuilt from a backup or a repository.
              - The latest backup result is good.
            keep: The backup list and the repository's latest version
            shows:
              - The scheduler and the date
    choosing_people:
      performer:
        - Administers the backup tool and can rerun a backup
        - Sees backup alerts as part of their normal work
        - Knows which systems are in scope and their tiers
      reviewer:
        - Doesn't administer the backups
        - Knows the systems well enough to notice one missing from the job list
      small_team: If one person runs all the backups, have the application owner check the job list against their systems, and write that into your procedure.

  - id: DR-02
    title: Restores are tested
    why: >-
      A backup is only proven when someone restores from it. Without a test, missing files, corrupt copies,
      lost keys and optimistic time estimates are found during a real outage. A tested restore finds them
      while there is time to fix them, and shows how long recovery really takes.
    applies_when:
      - The system is backed up.
    nature: detective
    method: manual
    frequency: annual
    level: key
    owned_by: Application owner
    performed_by: Backup administrator
    reviewed_by: Control owner
    stage: Back up and restore
    categories: [application, database, operating_system, cloud, jobs]
    steps:
      - do: Decide what to test and how often.
        how: >-
          Choose which systems are tested and what a test covers, such as a full database, a server or the
          configuration, starting with the highest BCP tiers. Write the plan and how often each is tested in
          your procedure.
        weigh:
          - How much the system or its backup setup has changed since the last test
          - The RTO (recovery time objective, how long the system can be down) that comes with its BCP tier, and how sure the team is it can be met
          - How much effort a test takes, and whether a test environment is available
          - Whether a failed test should be repeated sooner
        evidence:
          keep: The test plan
          shows:
            - The date, and the systems and backups to be tested
      - do: Restore a real backup to a separate place.
        how: >-
          Take an actual production backup, not one made for the test, and restore it somewhere other than
          the live system. Time it from start to the point the system or data is usable.
        commands:
          - platform: SQL Server
            note: >-
              Checks a backup file is complete and readable, as a quick check before or between full
              restores; it doesn't replace a restore. Replace the path.
            code: |
              RESTORE VERIFYONLY FROM DISK = N'<backup file path>' WITH CHECKSUM;
          - platform: Windows Server
            note: Lists the Windows Server Backup versions available to restore from.
            code: |
              wbadmin get versions
          - platform: AWS
            note: Automated RDS snapshots for an instance, to pick a real backup to restore; replace <instance>.
            code: |
              aws rds describe-db-snapshots --db-instance-identifier <instance> --snapshot-type automated
      - do: Check the restored data is complete and usable.
        how: >-
          Compare row counts or totals with the source as of the backup, open key records, and have the
          application owner confirm the application works against it. Compare the time taken with the RTO.
        evidence:
          keep: The test record
          shows:
            - The date, who did it, and which backup was used (system and when it was taken)
            - Where it was restored, the checks made and their results
            - The time taken compared with the RTO
        commands:
          - platform: SQL Server
            note: Checks the restored database for corruption; replace the name.
            code: |
              DBCC CHECKDB (N'<restored database>') WITH NO_INFOMSGS;
      - do: Fix what went wrong and test again.
        how: >-
          Every problem gets a ticket with the cause and the fix, and a failed test is repeated after the
          fix so the backup is proven, not just repaired.
        evidence:
          keep: The tickets and the repeat test record
          shows:
            - The cause and fix for each problem
            - The result of the repeat test
      - do: Review it regularly.
        how: >-
          Someone who didn't run the test checks the record, that problems were fixed and retested, and
          that every system due a test has had one.
        evidence:
          keep: The dated review
          shows:
            - Who reviewed it, when, and the test records they looked at
            - Systems overdue a test, and what was decided
      - do: Check it on each platform.
        how: >-
          For each platform this control applies to, this says where to look, what good looks like and what to
          keep. Platform admins run the platform; Platform users use it for their own systems.
        checks:
          - platform: SQL Server
            audience: Platform users
            where: Your team's restore test record, and the restored database in a separate place.
            good:
              - The restore used a real production backup and a separate server.
              - The integrity check passed, row counts or totals match the source as of the backup, and the application owner confirmed the data.
              - The time taken is compared with the time your team has set for the tier.
              - Each problem has a ticket and a repeat test.
            keep: The test record for the period
            shows:
              - The date, who did it and which backup was used
              - The checks made and their results
          - platform: Windows Server
            audience: Platform admins
            where: Windows Server Backup, then Recover, on a separate server.
            good:
              - A restore from a real backup has been done to a separate server in the period the plan sets.
              - The restored server starts and its services work.
            keep: The restore test record
            shows:
              - The date, the backup used and the result
          - platform: Active Directory
            audience: Platform admins
            where: A test restore of a domain controller in an isolated network.
            good:
              - A domain controller has been restored from backup in isolation, and replication and sign-in were tested.
              - The restore did not touch the live domain.
            keep: The restore test record
            shows:
              - The date and the backup used
              - What was tested and the result
          - platform: AWS
            audience: Platform users
            where: AWS Backup, then Jobs, then Restore jobs, in your team's account.
            good:
              - A restore job from a real recovery point completed to a separate resource.
              - The restored data was checked, and the time taken compared with the time your team has set.
            keep: The restore job record and the test record
            shows:
              - The account, the recovery point and the date
          - platform: Azure
            audience: Platform users
            where: The Recovery Services vault, then Backup jobs, in your team's subscription.
            good:
              - A restore to a separate resource completed from a real recovery point.
              - The restored data was checked and the time taken compared with the time your team has set.
            keep: The restore job record and the test record
            shows:
              - The subscription, the recovery point and the date
          - platform: Databricks
            audience: Platform users
            where: A test restore of a key table (for example a Delta table version, or a copy from storage) in a separate workspace area.
            good:
              - A key table was restored and its row counts or totals match the source as of the backup.
              - Notebooks and job definitions were restored from the repository.
            keep: The test record
            shows:
              - The date, the table and the result
          - platform: Kubernetes
            audience: Platform admins
            where: A test restore of the cluster state into a separate cluster.
            good:
              - The cluster state was restored to a separate cluster and its workloads started.
              - Secrets and volumes the workloads need were part of the test.
            keep: The test record
            shows:
              - The cluster, where it runs, and the date
          - platform: GitHub Enterprise Server
            audience: Platform admins
            where: A test restore of a snapshot to a separate appliance.
            good:
              - The restored appliance shows repositories, users and settings as of the snapshot.
            keep: The test record
            shows:
              - The snapshot used and the date
    choosing_people:
      performer:
        - Can restore from the backup tool to a separate environment
        - Works with the application owner, who can tell whether the data looks right
      reviewer:
        - Didn't run the test
        - Knows the recovery targets for the system's tier
      small_team: If the backup administrator is the only one who can restore, have the application owner witness the test and sign the record, and write that into your procedure.

  - id: DR-03
    title: A recovery plan exists and is tested for the most critical systems
    why: >-
      In a serious outage people work under stress, often without their usual tools. Without a plan, time
      goes on working out the order of steps and who decides, while tier 0 and tier 1 systems stay down. A
      written plan the team has practiced turns recovery into steps they've done before.
    applies_when:
      - The system is BCP tier 0 or tier 1.
    nature: preventive
    method: manual
    frequency: annual
    level: non-key
    owned_by: Head of Engineering
    performed_by: Recovery lead
    reviewed_by: Control owner
    stage: Plan
    categories: [application, database, operating_system, cloud, jobs]
    steps:
      - do: Map what the system depends on.
        how: >-
          List the other systems, shared services (such as Active Directory, Entra ID and the network) and
          vendors it needs, and where it will run if its usual site is lost. Dependencies set the recovery
          order.
        evidence:
          keep: The dependency map
          shows:
            - The date, and each dependency with its own BCP tier
      - do: Write the plan.
        how: >-
          The plan names the recovery order, the people and their backups, the RTO and RPO (how long the
          system can be down and how much recent data can be lost) that come with the tier, who can decide
          to start recovery, and how to reach people if email and chat are down. Keep it where it can be
          read during an outage. It covers getting IT back; how the business keeps working meanwhile sits
          with [the BCP team's continuity plans](#todo-bcp-continuity-plans).
        evidence:
          keep: The plan
          shows:
            - Its version, date and who approved it
            - The RTO and RPO for the tier
      - do: Decide how often to exercise it.
        how: Write in your procedure how often the plan is exercised, and when a failover is part of it.
        weigh:
          - The RTO and RPO for the tier, and when they were last proven
          - How often the system, its dependencies or the people named in the plan change
          - Whether the exercise needs a failover or an outage window booked ahead
      - do: Exercise it.
        how: >-
          Run the exercise with the people named in the plan, including the failover set-up where there is
          one. A walk-through finds gaps in the plan; an actual failover proves the targets.
        evidence:
          keep: The exercise record
          shows:
            - The date, who took part, and whether it was a walk-through or a failover
            - Times achieved against the RTO and RPO
            - What didn't work, each with an owner
      - do: Fix the gaps and update the plan.
        how: >-
          Track every follow-up item until it's done, and update the plan after any exercise, real outage
          or major change to the system.
        evidence:
          keep: The follow-up list and the updated plan
          shows:
            - Each item, its owner and when it was closed
            - The new plan version and its date
      - do: Review it regularly.
        how: >-
          Someone other than the recovery lead checks the plan is current (people, contacts and
          dependencies), follow-up items are closed, and the exercise happened when it should.
        evidence:
          keep: The dated review
          shows:
            - Who reviewed it, when, and the plan version they looked at
            - What was out of date and what was decided
      - do: Check it on each platform.
        how: >-
          For each platform this control applies to, this says where to look, what good looks like and what to
          keep. Platform admins run the platform; Platform users use it for their own systems.
        checks:
          - platform: SQL Server
            audience: Platform users
            where: Your team's recovery plan, and the failover set-up (for example availability groups) if there is one.
            good:
              - The plan names the recovery order, the people and their backups, and who decides to start recovery.
              - The exercise included the database and its failover, and the times were compared with the targets for the tier.
            keep: The plan and the exercise record
            shows:
              - The plan's version and date
              - What did not work, each with an owner
          - platform: AWS
            audience: Platform users
            where: Your team's recovery plan, and the infrastructure code or images that rebuild the account's resources.
            good:
              - The plan covers losing the region or the account, and says where the system will run.
              - The exercise rebuilt from code or images, and the times were compared with the targets for the tier.
            keep: The plan and the exercise record
            shows:
              - The plan's version and date
              - Times achieved against the targets
          - platform: Azure
            audience: Platform users
            where: Your team's recovery plan, and the infrastructure code or images that rebuild the subscription's resources.
            good:
              - The plan covers losing the region, and says where the system will run.
              - The exercise rebuilt from code or images, and the times were compared with the targets for the tier.
            keep: The plan and the exercise record
            shows:
              - The plan's version and date
              - Times achieved against the targets
          - platform: Kubernetes
            audience: Platform admins
            where: The cluster rebuild steps, and where the workloads' definitions are kept.
            good:
              - A cluster can be rebuilt from the steps and the stored definitions, on a cloud or on the firm's own servers.
              - The exercise was run by the people named in the plan.
            keep: The rebuild steps and the exercise record
            shows:
              - The date and where it was run
          - platform: Active Directory
            audience: Platform admins
            where: The domain controller recovery steps in the plan.
            good:
              - The plan says who restores the first domain controller and in what order the others follow.
              - The plan was exercised with the people named in it.
            keep: The recovery steps and the exercise record
            shows:
              - The date and who took part
          - platform: Entra ID
            audience: Platform admins
            where: The plan's steps for losing sign-in, including emergency accounts and sync.
            good:
              - Emergency accounts exist, are held by named people and are tested.
              - The plan says how people sign in if the directory sync or the tenant is not available.
            keep: The plan's steps and the test record for the emergency accounts
            shows:
              - The date and who tested them
          - platform: VPN
            audience: Platform admins
            where: The plan's steps for reaching systems when the VPN is down.
            good:
              - The plan says how the team reaches the systems it needs to recover if the VPN is down.
              - The way in was tested.
            keep: The plan's steps and the test record
            shows:
              - The date and who tested it
    choosing_people:
      performer:
        - Knows the system's architecture and its dependencies
        - Can bring the right people together for an exercise
        - Has led or taken part in a recovery before, or will shadow someone who has
      reviewer:
        - Isn't the recovery lead
        - Understands the BCP tier targets and can judge whether an exercise proved them
      small_team: If the recovery lead is the only one who knows the system, have a lead from another tier 0 or tier 1 system review the plan and the exercise, and write that into your procedure.

  - id: DR-04
    title: Access to backups is restricted
    why: >-
      Backups hold a full copy of the data and are the last line of defense. If many administrators can
      reach them, or they share permissions with the live system, one compromised account can read the
      data or delete the only good copy, as ransomware attacks try to. Limiting and logging access protects
      both the data and the ability to recover.
    applies_when:
      - The system is backed up, and the backups hold sensitive or financial data.
    nature: preventive
    method: it_dependent
    frequency: quarterly
    level: supporting
    owned_by: Head of Engineering
    performed_by: Backup administrator
    reviewed_by: Control owner
    theme: Backup access
    categories: [application, database, operating_system, cloud, identity]
    steps:
      - do: List who can reach the backups.
        how: >-
          Pull permissions from the backup tool and the storage itself, such as vault policies, cloud roles
          and folder permissions. Expand groups to members and include service accounts, so the list is
          complete.
        evidence:
          keep: The backup access list
          shows:
            - The date and the system it came from
            - Every person and account, with groups expanded, and what each can do (read, restore, change, delete)
        commands:
          - platform: AWS
            audience: Platform admins
            note: The resource policy on an AWS Backup vault; IAM policies can grant access too. Replace <vault>.
            code: |
              aws backup get-backup-vault-access-policy --backup-vault-name <vault>
          - platform: Azure
            audience: Platform admins
            note: Role assignments on a Recovery Services vault, including inherited ones; replace <vault-resource-id>.
            code: |
              az role assignment list --scope <vault-resource-id> --include-inherited --output table
          - platform: Windows Server
            audience: Platform admins
            note: Who has which permissions on a backup folder; replace the path.
            code: |
              Get-Acl -Path '<backup folder>' | Select-Object -ExpandProperty Access
      - do: Limit it to the people and tools that need it.
        how: >-
          Only named people and tools whose jobs need it can read, restore, change or delete backups, and
          backup permissions are separate from the live system's, so an administrator of one isn't
          automatically an administrator of the other. Remove the rest.
        evidence:
          keep: The ticket for each removal
          shows:
            - What was removed, from which system, and when
      - do: Make deleting backups hard.
        how: >-
          Deleting or changing a backup needs more than one control, such as a delay before deletion takes
          effect, a second approver, or a copy that can't be changed (for example AWS Backup Vault Lock or an
          Azure immutable vault).
        evidence:
          keep: The protection settings for each vault or store
          shows:
            - The date and the vault or store they came from
            - The protection in place
        commands:
          - platform: AWS
            audience: Platform admins
            note: An AWS Backup vault's settings, including whether Vault Lock is on and its retention limits; replace <vault>.
            code: |
              aws backup describe-backup-vault --backup-vault-name <vault>
      - do: Check restores and deletions.
        how: >-
          Restores and deletions are logged, and someone without backup access reviews them and
          investigates any that weren't expected.
        evidence:
          keep: The restores and deletions for the period, with notes
          shows:
            - The period, and the query or report used with its output
            - Who did each one and why
            - Follow-up on anything unexpected
        commands:
          - platform: AWS
            audience: Platform admins
            note: >-
              Recent deletions of AWS Backup recovery points from CloudTrail; run again with StartRestoreJob
              for restores. Lookup covers recent events only, so use your CloudTrail data in Splunk for a full period.
            code: |
              aws cloudtrail lookup-events --lookup-attributes AttributeKey=EventName,AttributeValue=DeleteRecoveryPoint
      - do: Review it regularly.
        how: >-
          Someone who doesn't hold backup access goes through a fresh access list, confirms each entry is
          still needed, and removes the rest.
        policy: "[Access Control Policy](#todo-access-control-policy)"
        evidence:
          keep: The reviewed access list with a decision on each entry
          shows:
            - Who reviewed it and when
            - The dated list they looked at and the system it came from
            - The decision on each entry, and the ticket for each removal
      - do: Check it on each platform.
        how: >-
          For each platform this control applies to, this says where to look, what good looks like and what to
          keep. Platform admins run the platform; Platform users use it for their own systems.
        checks:
          - platform: SQL Server
            audience: Platform admins
            where: Security, then Server Roles, and the folder or storage the backups are written to.
            good:
              - Only named administrators can restore or delete backups, and the backup location is separate from the data location.
              - Backup files are readable only by the accounts that need them.
            keep: The dated list of who can read or change the backups
            shows:
              - The instance, the backup location and the date
              - Every person and account, with groups expanded
          - platform: Windows Server
            audience: Platform admins
            where: The backup folder's Security tab, or the command for this platform.
            good:
              - Only named people and the backup tool's account have access.
              - Groups are expanded to members and service accounts are on the list.
            keep: The dated permissions list for each backup folder
            shows:
              - The server and the date
              - Every person and account, with groups expanded
          - platform: Active Directory
            audience: Platform admins
            where: Active Directory Users and Computers, then Builtin, then Backup Operators.
            good:
              - Only named people are in Backup Operators, and the group is not used for everyday work.
            keep: The dated list of members of Backup Operators
            shows:
              - The domain and the date
              - Every person and account, with groups expanded
          - platform: AWS
            audience: Platform admins
            where: AWS Backup, then Vaults, then Access policy, and the IAM roles that can reach the vault, or the commands for this platform.
            good:
              - Only named roles can delete recovery points.
              - Vault Lock or another protection stops a single administrator deleting the only good copy.
            keep: The vault's access policy and its protection settings
            shows:
              - The account, the vault and the date
          - platform: AWS
            audience: Platform users
            where: CloudTrail, then Event history, or the same events in Splunk, for your team's account.
            good:
              - Restores and deletions of recovery points in the period were reviewed by someone without backup access.
              - Anything unexpected has a follow-up.
            keep: The restores and deletions for the period, with the review notes
            shows:
              - The period covered and the account
              - Who did each one and why
          - platform: Azure
            audience: Platform admins
            where: The Recovery Services vault, then Access control (IAM), and its security settings.
            good:
              - Only named people and tools hold roles on the vault, including inherited ones.
              - Soft delete or an immutable vault is on, and deleting a backup needs more than one person.
            keep: The role assignments and the vault's protection settings
            shows:
              - The vault and the date
              - Every person and account, with groups expanded
    choosing_people:
      performer:
        - Administers the backup tool and its storage
        - Can pull permissions directly and expand groups
      reviewer:
        - Holds no access to the backups themselves
        - Knows who should be restoring or deleting backups, so an odd one stands out
      small_team: If everyone on the team can reach the backups, have someone from security or another team review the access list and the deletion log, and write that into your procedure.
