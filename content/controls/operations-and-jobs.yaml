# Controls and risks for the "Operations and jobs" topic, one entry per TRAC ID.
# The format is described in content/controls/README.md.
# Check the file after editing with .\trac.ps1 check

# Jobs run in many places: applications, SQL Server Agent, Windows scheduled tasks, the in-house
# scheduling app, platforms and others. The job controls apply to all of them.

topic: Operations and jobs

risks:
  - id: R-MO-01
    title: Scheduled jobs are changed without approval
    statement: >-
      A job, its schedule or its settings are changed so that financial data is processed differently,
      late or not at all. This can happen when job definitions are edited directly on the scheduler
      without a request or review. The result could be wrong or missing data in reports, found only when
      someone downstream notices.
    owned_by: Application owner
    theme: Job scheduling and monitoring
    in_sox_scope: yes
    covered_by:
      - control: MO-01
        coverage: full
        why: Every change to a job definition or schedule is requested, reviewed and approved before it takes effect.
      - control: MO-03
        coverage: partial
        why: Fewer people can edit jobs, so fewer unapproved changes are possible.

  - id: R-MO-02
    title: Job failures go unnoticed or unresolved
    statement: >-
      A scheduled job fails, stops early or runs late and nobody acts on it. This can happen when failures
      send no alert, alerts go to a mailbox nobody reads, or there is no record of the follow-up. The result
      could be incomplete or stale data feeding reports and downstream systems.
    owned_by: Application owner
    theme: Job scheduling and monitoring
    in_sox_scope: yes
    covered_by:
      - control: MO-02
        coverage: full
        why: Failures are alerted, investigated and resolved, with a record of each.
      - control: MO-01
        coverage: partial
        why: Controlled changes reduce failures caused by edits nobody reviewed.

  - id: R-MO-03
    title: Scheduler access is too broad
    statement: >-
      Too many people or accounts can create, edit, run or stop jobs on a scheduler or on SQL Server Agent.
      This can happen when access is granted with the server rather than for the job, or the scheduler runs
      jobs as a highly privileged account. The result could be data changed or jobs stopped by people who
      should not be able to do so, with unclear records of who did it.
    owned_by: Head of Engineering
    theme: Job scheduling and monitoring
    in_sox_scope: yes
    covered_by:
      - control: MO-03
        coverage: full
        why: Access to define and run jobs is limited to named roles and reviewed.
      - control: MO-01
        coverage: partial
        why: Changes by people with access still need an approved request.

  - id: R-MO-04
    title: Data transfers into financial systems are incomplete or inaccurate
    statement: >-
      Data sent between systems, such as a feed into a financial system, arrives incomplete, duplicated
      or not at all. This can happen when a transfer fails part way, records are rejected and nobody
      works them, or the receiving side is never compared with the sending side. The result could be
      financial reports built on missing or doubled data.
    owned_by: Application owner
    theme: Interfaces and data transfers
    in_sox_scope: yes
    covered_by:
      - control: MO-04
        coverage: full
        why: Counts and totals are reconciled between source and target, rejected records are worked, and failures raise alerts.
      - control: MO-02
        coverage: partial
        why: A failed job that carries the transfer is alerted and resolved.

controls:
  - id: MO-01
    title: Changes to scheduled jobs go through change control
    why: >-
      A job is production processing: changing its steps, schedule or settings changes the data the firm
      ends up with. Without change control, a quick edit on the scheduler can skip a load or change a
      calculation, and nobody finds out until a report looks wrong. With it, every change has a reason, a
      second pair of eyes and a record that matches what is actually running.
    applies_when:
      - You run scheduled jobs, whether on SQL Server Agent, Windows Task Scheduler, the in-house scheduler, Databricks, Kubernetes or anywhere else.
    nature: preventive
    method: it_dependent
    frequency: event
    level: key
    owned_by: Application owner
    performed_by: Job owner
    reviewed_by: Peer reviewer
    theme: Job scheduling and monitoring
    categories: [application, database, operating_system, jobs, cloud]
    references:
      - label: "Worked example, part 3: the job inventory and one failure"
        link: /guides/worked-example-3-jobs/
    steps:
      - do: List your jobs and where each one is defined.
        how: >-
          Pull the job list from each scheduler itself, so it is complete, and note whether each job is
          defined in code in a repository or edited directly on the scheduler. Jobs in code already go
          through the pull request process, as in "CI/CD pipelines as change control"; the ones edited on
          the scheduler are the ones this control has to catch.
        evidence:
          keep: The job inventory
          shows:
            - The date it was pulled and the scheduler it came from
            - Every job, including disabled ones, with where its definition lives
        commands:
          - platform: SQL Server
            note: Lists every SQL Server Agent job with when it was created and last changed.
            code: |
              SELECT name, enabled, date_created, date_modified
              FROM msdb.dbo.sysjobs
              ORDER BY name;
          - platform: Windows Server
            note: Lists scheduled tasks on the server, leaving out the built-in Microsoft ones.
            code: |
              Get-ScheduledTask |
                Where-Object TaskPath -notlike '\Microsoft\*' |
                Select-Object TaskPath, TaskName, State
          - platform: Kubernetes
            note: Lists every CronJob in every namespace, with its schedule and last run.
            code: |
              kubectl get cronjobs -A
      - do: Rank them, and write down why.
        how: >-
          Decide which jobs matter most: what breaks downstream, who relies on the output and how soon
          they would notice. The ranking tells you which job changes need the closest look, and the
          reason lets someone else agree with it later.
        evidence:
          keep: The job inventory with a priority and a reason against each job
          shows:
            - Who agreed the ranking and when
      - do: Raise a request for every change.
        how: >-
          A new job, or a changed step, schedule or dependency, starts with a recorded request saying what
          changes and why. Test it outside production where the job's risk calls for it, and have someone
          other than the person making the change approve it before it takes effect.
        evidence:
          keep: The request for each change
          shows:
            - What changed and why
            - The test results, or a note of why testing wasn't needed
            - Who approved it and when, before the change took effect
      - do: Record what was actually changed.
        how: >-
          Link the job definition before and after the change, or the deployment record, to the request.
          This is what shows the change in production matches the one that was approved.
        evidence:
          keep: The before and after definition, or the deployment record, for each change
          shows:
            - The request it belongs to
            - The date it was applied and who applied it
      - do: Get a list of every change from the scheduler.
        how: >-
          Produce a system-generated list of job changes for the period, so the check doesn't rely on
          people remembering to raise requests. If the scheduler keeps no change history, export the job
          definitions on a schedule and compare each export with the last one.
        evidence:
          keep: The list of job changes for the period
          shows:
            - The period covered and the scheduler it came from
            - How it was produced, as the query or export with its output
        commands:
          - platform: SQL Server
            note: >-
              Jobs changed since a date. It shows only each job's latest change, so a job changed twice
              appears once; replace the date with the start of your period.
            code: |
              SELECT name, date_modified
              FROM msdb.dbo.sysjobs
              WHERE date_modified >= '2027-01-01'
              ORDER BY date_modified;
      - do: Review it regularly.
        how: >-
          Someone who doesn't change jobs matches the list of changes to approved requests and follows up
          every change with no request. Write in your procedure how often this happens.
        weigh:
          - How often jobs change, and how many people can change them
          - Whether the scheduler keeps a change history that can be compared automatically
          - How long an unapproved change could run before anyone noticed, and what it would affect downstream
        evidence:
          keep: The dated comparison of changes to requests
          shows:
            - Who reviewed it, when, and the period they looked at
            - Each change with no request, and what was decided about it
      - do: Check it on each platform.
        how: >-
          For each platform your jobs run on, this says where to look, what good looks like and what to
          keep. Platform admins run the platform; Platform users run their own jobs on it.
        checks:
          - platform: SQL Server
            audience: Platform users
            where: SQL Server Agent, then Jobs, in SQL Server Management Studio, or the query for this platform.
            good:
              - Every job changed in the period has a request that says what changed and why.
              - The person who approved each change is not the person who made it.
              - Each change was approved before the date it was applied.
              - Every job with a changed date and no request is listed, with what was decided.
            keep: The list of job changes for the period, matched to the requests
            shows:
              - The period covered and the instance it came from
              - For each change, its request, the approver and the date it was applied
          - platform: SQL Server
            audience: Platform admins
            where: The instance's audit settings (Security, then Audits, in SQL Server Management Studio) and the audit records in Splunk.
            good:
              - Changes to jobs on the instance are recorded, and someone who doesn't own the jobs can read the record.
              - Only a short list of named administrators can change or stop the audit.
              - The records reach Splunk and the feed keeps advancing.
            keep: A dated export of the audit settings, and a sample of the records of job changes
            shows:
              - The instance and the date
              - Who can change or stop the audit
          - platform: Windows Server
            audience: Platform users
            where: Task Scheduler on the server (Task Scheduler Library), or the query for this platform.
            good:
              - Each scheduled task changed in the period has a request.
              - A new export of the task list, compared with the one before it, shows no change without a request.
            keep: The dated task list for the server, with the comparison to the one before
            shows:
              - The date and the server it came from
              - Each difference and the request it belongs to
          - platform: Windows Server
            audience: Platform admins
            where: The server's Task Scheduler history in Event Viewer, and the server's logs in Splunk.
            good:
              - Task Scheduler history is switched on, so creating or changing a task leaves a record.
              - Those records reach Splunk.
              - Only named people can create or change tasks (see MO-03).
            keep: The history setting and a sample of task-change events from Splunk
            shows:
              - The server and the date
              - Who and what each sample event records
          - platform: In-house job scheduler
            audience: Platform users
            where: The scheduler's job list and its record of job changes, which the scheduler sends to Splunk.
            good:
              - Every job changed in the period has a request.
              - Each job's live definition matches the approved one.
              - Each change was approved by someone other than the person who made it.
            keep: The list of job changes for the period, matched to the requests
            shows:
              - The period covered and where the list came from
              - For each change, its request, the approver and the date it was applied
          - platform: In-house job scheduler
            audience: Platform admins
            where: The scheduler's own settings for who can edit jobs, and its change records in Splunk.
            good:
              - Every edit to a job is recorded with who made it and when.
              - The records reach Splunk and the feed keeps advancing.
              - An edit made outside change control is found, by an alert or by comparing the live definition with the approved one.
            keep: A dated export of the settings, and a sample of the change records
            shows:
              - The date and where each came from
              - Who can edit jobs
          - platform: Databricks
            audience: Platform users
            where: Workflows, then Jobs, in the workspace, and the job definitions in the repository they are deployed from.
            good:
              - Jobs deployed from the repository went through a pull request.
              - A job edited directly in the workspace is found, and has a request.
            keep: The list of jobs with where each one is defined, and the request for each change in the period
            shows:
              - The date and the workspace
              - For each change, its request or pull request and the approver
          - platform: Databricks
            audience: Platform admins
            where: The workspace audit logs, where they are switched on.
            good:
              - Creating, changing and deleting a job is recorded with who did it and when.
              - Only named people can edit a job outside the deployment pipeline.
            keep: A dated export of the audit settings, and a sample of job-change records
            shows:
              - The workspace and the date
              - Who can edit jobs outside the pipeline
          - platform: Kubernetes
            audience: Platform users
            where: The CronJobs in the cluster, or the query for this platform, and their manifests in the repository.
            good:
              - Every CronJob in the cluster matches a manifest in the repository.
              - Changes were applied by the deployment pipeline and not by hand.
            keep: The list of CronJobs with the manifest each one matches
            shows:
              - The cluster and the date
              - Any CronJob with no matching manifest, and what was decided
    choosing_people:
      performer:
        - Owns the job and knows what it feeds
        - Can describe a change well enough for someone else to judge it
        - Has the access to apply the change, and no wider
      reviewer:
        - Didn't write or apply the change being approved
        - Understands the job well enough to spot a change that would alter financial data
        - For the review of changes against requests, doesn't change jobs on that scheduler
      small_team: If the only other engineer also changes jobs, have someone from another team match a sample of changes to requests, and write that into your procedure.

  - id: MO-02
    title: Job failures are monitored, investigated and resolved
    why: >-
      A failed or missed job can leave a report short of data with no visible error. A job inventory
      gives every scheduled job a name, an owner and a rating, so a failure is noticed by the right
      person and fixed in a time the team has chosen. It turns a silent gap into a problem someone fixes.
    applies_when:
      - Your team runs scheduled jobs, wherever they run (SQL Server, Windows, the in-house scheduling app, a platform or an application).
    nature: detective
    method: it_dependent
    frequency: event
    level: key
    owned_by: Application owner
    performed_by: Job operator
    reviewed_by: Control owner
    theme: Job scheduling and monitoring
    categories: [application, database, operating_system, jobs, cloud, logging]
    references:
      - label: "Worked example, part 3: the job inventory and one failure"
        link: /guides/worked-example-3-jobs/
    steps:
      - do: Keep an inventory of your scheduled jobs.
        how: >-
          Pull every scheduled job and data transfer from the scheduler itself, so the list is complete.
          Recommended attributes to track for each job are its name; where it runs; the job's owner;
          what it does and what it feeds; its rating; how a failure is noticed and who is told; how
          quickly a failure is addressed (the team's own time); and where the record of a failure and
          its fix is kept.
        evidence:
          keep: The job inventory
          shows:
            - The date it was pulled and the scheduler it came from
            - Every job, including disabled ones, with each of the eight attributes filled in
            - A named owner against every job
        commands:
          - platform: SQL Server
            note: Lists every SQL Server Agent job on the instance.
            code: |
              SELECT name, enabled, date_created, date_modified
              FROM msdb.dbo.sysjobs
              ORDER BY name;
      - do: Rate each job High, Medium or Low, and write down why.
        how: >-
          A rating tells people which jobs need the closest attention. A higher rating means a failure
          is noticed and addressed sooner. The reason beside each rating is what lets someone else
          agree with it later.
        weigh:
          - How important the job is
          - The worst case if it fails
          - Whether it feeds financial reporting
          - Whether another control relies on it
          - Whether it belongs to a tier 0 or tier 1 app
        evidence:
          keep: The job inventory with a rating and a reason against each job
          shows:
            - Who agreed the ratings and when
      - do: Make failures visible.
        how: >-
          Each job raises an alert when it fails, doesn't start or runs long, and the inventory says who
          is told. Higher-rated jobs are noticed sooner. The alert goes to a queue someone watches, with
          cover when they're away. Logs from the in-house scheduling app go to Splunk, which is one
          place to build alerts for it.
        evidence:
          keep: The alert settings and the list of jobs they cover
          shows:
            - The date, and that every job in the inventory is covered or has a reason it isn't
      - do: Write down how quickly each rating gets addressed.
        how: >-
          Your team picks its own times for High, Medium and Low and writes them in the
          inventory, with higher ratings addressed sooner.
        weigh:
          - When the next job or report needs this data
          - Who is affected downstream, and whether they can be told early
          - Who is available to fix it out of hours
          - What the system's BCP tier implies for how late its data can be
        evidence:
          keep: The times your team set for each rating
          shows:
            - The date they were agreed and who agreed them
      - do: Keep a record of every failure and its fix.
        how: >-
          Each failure gets a record with the cause, the fix and the date it was resolved, kept in the
          place the inventory names for that job.
        evidence:
          keep: The list of failed runs for the period, and the record for each
          shows:
            - The period covered and a count that matches the scheduler's own history
            - For each failure, the cause, the fix and when it was resolved
        commands:
          - platform: SQL Server
            note: Failed job runs since a date (run_status 0 is failed; step_id 0 is the job outcome).
            code: |
              SELECT j.name, h.run_date, h.run_time, h.message
              FROM msdb.dbo.sysjobhistory AS h
              JOIN msdb.dbo.sysjobs AS j ON j.job_id = h.job_id
              WHERE h.step_id = 0 AND h.run_status = 0
                AND h.run_date >= 20270101
              ORDER BY h.run_date, h.run_time;
      - do: Review it regularly.
        how: >-
          Someone other than the operator checks that every failure was handled within the team's own
          times, new jobs were added to the inventory, the ratings still hold and repeat failures got
          a root cause.
        evidence:
          keep: The dated review, with notes on anything that slipped
          shows:
            - Who reviewed it, when, and the period they looked at
      - do: Check it on each platform.
        how: >-
          For each platform your jobs run on, this says where to look, what good looks like and what to
          keep. Platform admins run the platform; Platform users run their own jobs on it.
        checks:
          - platform: SQL Server
            audience: Platform users
            where: SQL Server Agent, then Jobs, then View History, in SQL Server Management Studio, or the query for this platform.
            good:
              - Every job in the inventory has a named owner and a way a failure is noticed.
              - Every failed run in the period has a record with its cause, its fix and the date it was resolved.
              - The count of failures in the record matches the job history.
            keep: The list of failed runs for the period, and the record for each
            shows:
              - The period covered and the instance it came from
              - For each failure, the cause, the fix and when it was resolved
          - platform: SQL Server
            audience: Platform admins
            where: SQL Server Agent, then Alerts and Operators, and the Database Mail settings the alerts use.
            good:
              - An operator receives job failure notifications, and the address is a queue someone watches.
              - A test notification arrives.
              - Job history is kept for at least the period being reviewed.
            keep: A dated export of the operators and alerts, and the result of a test notification
            shows:
              - The instance and the date
              - Who receives the notifications
          - platform: Windows Server
            audience: Platform users
            where: Task Scheduler on the server, the Last Run Result column and each task's history.
            good:
              - Every task in the inventory has a way a failure is noticed, such as an alert in Splunk.
              - Every failed run in the period has a record with its cause, its fix and the date it was resolved.
            keep: The list of failed runs for the period, and the record for each
            shows:
              - The period covered and the server it came from
              - For each failure, the cause, the fix and when it was resolved
          - platform: Windows Server
            audience: Platform admins
            where: Task Scheduler history in Event Viewer, and the server's logs in Splunk.
            good:
              - Task Scheduler history is switched on and reaches Splunk.
              - The alert for failed tasks reaches a queue someone watches.
            keep: The history setting and the alert settings
            shows:
              - The server and the date
              - Where the alert goes
          - platform: In-house job scheduler
            audience: Platform users
            where: The scheduler's job list and run history, and the searches and alerts built on its logs in Splunk.
            good:
              - Every job in the inventory appears in the run history.
              - Failed, missed and long-running jobs raise an alert to a queue someone watches.
              - Every failed run in the period has a record with its cause, its fix and the date it was resolved.
              - The count of failures in the record matches the run history.
            keep: The list of failed runs for the period, and the record for each
            shows:
              - The period covered and where the list came from
              - For each failure, the cause, the fix and when it was resolved
          - platform: In-house job scheduler
            audience: Platform admins
            where: The scheduler's logging settings, and the Splunk searches and alerts built on its logs.
            good:
              - The scheduler's logs reach Splunk and the feed keeps advancing, with no gaps.
              - Only named people can change the alerts.
            keep: A dated export of the alert settings and the search that shows the feed advancing
            shows:
              - The date and where each came from
              - Who can change the alerts
          - platform: Databricks
            audience: Platform users
            where: Workflows, then Jobs, then Runs, and each job's notification settings.
            good:
              - Every job in the inventory sends a notification when it fails, to a queue someone watches.
              - Every failed run in the period has a record with its cause, its fix and the date it was resolved.
            keep: The list of failed runs for the period, and the record for each
            shows:
              - The period covered and the workspace it came from
              - For each failure, the cause, the fix and when it was resolved
          - platform: Databricks
            audience: Platform admins
            where: The workspace settings for notification destinations, and the job run history.
            good:
              - Notification destinations are set up and a test message arrives.
              - Run history is kept for at least the period being reviewed.
            keep: The destination settings and the result of a test message
            shows:
              - The workspace and the date
              - Where each destination goes
    choosing_people:
      performer:
        - Sees the alerts as part of their daily work
        - Has the access to rerun a job
        - Knows the jobs well enough to tell a real failure from noise
      reviewer:
        - Doesn't operate the jobs
        - Understands them well enough to question a closed record
        - Has the standing to get a fix prioritized
      small_team: If no one is independent, have someone from another team look at a sample, and write that into your procedure.

  - id: MO-03
    title: Access to the scheduler is limited
    why: >-
      Anyone who can edit or run a job can change what data is processed and when, or stop it altogether.
      Left alone, scheduler access tends to come with server access, and jobs end up running as powerful
      accounts. Keeping it to a few named people, with jobs running as limited accounts, limits what a
      mistake or misuse can reach and keeps the record of who did what clear.
    applies_when:
      - People or tools can create, edit, run or stop jobs on a scheduler, SQL Server Agent or Windows Task Scheduler.
    nature: preventive
    method: it_dependent
    frequency: quarterly
    level: non-key
    owned_by: Head of Engineering
    performed_by: Platform engineer
    reviewed_by: Control owner
    theme: Job scheduling and monitoring
    categories: [application, database, operating_system, jobs, identity]
    steps:
      - do: List who can manage jobs.
        how: >-
          Pull the list from the scheduler's own permissions, not from memory. On SQL Server that means
          sysadmin members and the SQL Server Agent roles in msdb; on Windows, the local Administrators
          group; on the in-house scheduler, its own access list. Expand groups to their members and include
          service accounts, so the list is complete.
        evidence:
          keep: The access list for each scheduler
          shows:
            - The date it was pulled and the scheduler it came from
            - Every person and account, with groups expanded to members
        commands:
          - platform: SQL Server
            audience: Platform admins
            note: Members of the SQL Server Agent roles in msdb, then members of sysadmin (who can manage every job).
            code: |
              SELECT r.name AS role_name, m.name AS member_name
              FROM msdb.sys.database_role_members AS rm
              JOIN msdb.sys.database_principals AS r ON r.principal_id = rm.role_principal_id
              JOIN msdb.sys.database_principals AS m ON m.principal_id = rm.member_principal_id
              WHERE r.name IN ('SQLAgentUserRole', 'SQLAgentReaderRole', 'SQLAgentOperatorRole');

              SELECT m.name AS sysadmin_member
              FROM sys.server_role_members AS rm
              JOIN sys.server_principals AS r ON r.principal_id = rm.role_principal_id
              JOIN sys.server_principals AS m ON m.principal_id = rm.member_principal_id
              WHERE r.name = 'sysadmin';
          - platform: Windows Server
            audience: Platform admins
            note: Members of the local Administrators group, who can create and change any scheduled task. AD groups appear as one entry; expand them in Active Directory.
            code: |
              Get-LocalGroupMember -Group Administrators
      - do: Remove access nobody needs.
        how: >-
          Each person or account on the list should have a job reason for it, granted through the access
          request control. People who build a job shouldn't also be able to change it in production
          outside change control.
        evidence:
          keep: The ticket for each removal
          shows:
            - What was removed, from which scheduler, and when
      - do: Run jobs as limited accounts.
        how: >-
          Each job runs as a service account holding only the permissions the job needs, following the
          service accounts control, rather than as sysadmin or a person's own login. Jobs owned by someone
          who has left the role are reassigned.
        evidence:
          keep: The list of jobs with the account each one runs as
          shows:
            - The date and the scheduler it came from
            - The owner and run-as account for every job
        commands:
          - platform: SQL Server
            note: >-
              Each job step with its job owner and proxy. A step with no proxy runs as the SQL Server Agent
              service account, or as the job owner for T-SQL steps.
            code: |
              SELECT j.name AS job_name, SUSER_SNAME(j.owner_sid) AS job_owner,
                     s.step_name, s.subsystem, p.name AS proxy_name
              FROM msdb.dbo.sysjobs AS j
              JOIN msdb.dbo.sysjobsteps AS s ON s.job_id = j.job_id
              LEFT JOIN msdb.dbo.sysproxies AS p ON p.proxy_id = s.proxy_id
              ORDER BY j.name, s.step_id;
          - platform: Windows Server
            note: The account and privilege level each scheduled task runs with.
            code: |
              Get-ScheduledTask |
                Where-Object TaskPath -notlike '\Microsoft\*' |
                Select-Object TaskName,
                  @{n='RunAs';e={$_.Principal.UserId}},
                  @{n='RunLevel';e={$_.Principal.RunLevel}}
      - do: Review it regularly.
        how: >-
          The job owners and someone who doesn't administer the scheduler go through a fresh access list
          and the run-as accounts, confirm each entry is still needed, and remove the rest.
        policy: "[Access Control Policy](#todo-access-control-policy)"
        evidence:
          keep: The reviewed access list with a decision on each entry
          shows:
            - Who reviewed it and when
            - The dated list they looked at and the scheduler it came from
            - The decision on each entry, and the ticket for each removal
      - do: Check it on each platform.
        how: >-
          For each platform your jobs run on, this says where to look, what good looks like and what to
          keep. Platform admins run the platform; Platform users run their own jobs on it.
        checks:
          - platform: SQL Server
            audience: Platform admins
            where: Security, then Server Roles (sysadmin), and msdb, then Security, then Roles (the SQL Server Agent roles), or the query for this platform.
            good:
              - Only named administrators are in sysadmin.
              - Each person or account in the Agent roles has a job reason, granted through the access request control.
              - Groups are expanded to their members, and service accounts are on the list.
            keep: The dated list of members of sysadmin and the Agent roles
            shows:
              - The instance it came from and the date
              - Every person and account, with groups expanded to members
          - platform: SQL Server
            audience: Platform users
            where: SQL Server Agent, then Jobs, then each job's properties (owner) and steps (Run as), or the query for this platform.
            good:
              - Every job has a named owner who is still in the role.
              - Job steps run through a proxy that holds only what the job needs, and not as sysadmin.
              - Jobs whose owner has left are reassigned.
            keep: The list of jobs with the owner and the account each one runs as
            shows:
              - The instance it came from and the date
              - The owner and run-as account for every job
          - platform: Windows Server
            audience: Platform admins
            where: Computer Management, then Local Users and Groups, then Groups, then Administrators, or the query for this platform.
            good:
              - Only named administrators are in the local Administrators group.
              - AD groups in it are expanded to their members.
            keep: The dated list of members of the Administrators group
            shows:
              - The server it came from and the date
              - Every person and account, with groups expanded to members
          - platform: Windows Server
            audience: Platform users
            where: Task Scheduler, then each task's properties (the account it runs as), or the query for this platform.
            good:
              - Each task runs as a service account, and not as a person.
              - A task runs with the highest privileges only where there is a written reason.
            keep: The list of tasks with the account and privilege level each one runs with
            shows:
              - The server it came from and the date
              - The run-as account for every task
          - platform: In-house job scheduler
            audience: Platform admins
            where: The scheduler's own access list, showing who can create, edit, run and delete jobs.
            good:
              - A small, named group can create, edit or delete jobs.
              - The right to edit a job is separate from the right to view its history.
              - Support staff who rerun a job have run-only rights.
            keep: The dated access list, with groups expanded to members
            shows:
              - The date and the scheduler it came from
              - Every person and account, and what each can do
          - platform: In-house job scheduler
            audience: Platform users
            where: The scheduler's job list, showing each job's owner and the account it runs as.
            good:
              - Every job has a named owner who is still in the role.
              - Each job runs as an account that is listed, owned and limited to what the job does, and not as a person.
            keep: The list of jobs with the owner and the account each one runs as
            shows:
              - The date and the scheduler it came from
              - The owner and run-as account for every job
          - platform: Databricks
            audience: Platform admins
            where: The workspace's admin settings (Identity and access) and each job's permissions.
            good:
              - Only a few named people or groups can manage jobs, and the groups come from the directory.
              - Production jobs are managed through a service principal, and not through a person's own access.
            keep: The dated list of who can manage jobs, with groups expanded to members
            shows:
              - The workspace and the date
              - Every person, group and service principal, and what each can do
          - platform: Databricks
            audience: Platform users
            where: Workflows, then Jobs, then each job's permissions and its Run as setting.
            good:
              - Every job has a named owner who is still in the role.
              - Production jobs run as a service principal and not as a person.
            keep: The list of jobs with the owner and the run-as identity of each
            shows:
              - The workspace and the date
              - The owner and run-as identity for every job
    choosing_people:
      performer:
        - Administers the scheduler or the servers it runs on
        - Can pull permissions directly from the scheduler and expand groups
        - Knows which service accounts the jobs use
      reviewer:
        - Doesn't hold scheduler admin rights themselves
        - Knows the jobs well enough to say whether someone still needs access
      small_team: If everyone on the team has scheduler access, have a manager from outside the team sign the review, and write that into your procedure.

  - id: MO-04
    title: Interface and data transfer completeness
    why: >-
      A feed can finish without an error and still deliver the wrong amount of data: a file cut short,
      records rejected, a batch loaded twice. Without a comparison, that shows up much later as a report
      that doesn't tie out. Comparing what was sent with what arrived, and working every rejected record,
      shows the receiving system holds all the data it should, once.
    applies_when:
      - Data moves by file, message, API or database link into a financial system or into a report used in a control.
    nature: detective
    method: it_dependent
    frequency: daily
    level: key
    owned_by: Application owner
    performed_by: Interface owner
    reviewed_by: Control owner
    theme: Interfaces and data transfers
    categories: [application, database, jobs, cloud]
    steps:
      - do: List your interfaces.
        how: >-
          For each transfer into a financial system or a control report, record the source, target, owner,
          schedule and the job that runs it. Build the list from the schedulers' job lists and the target's
          inbound connections, so a feed someone set up quietly still shows up, and add new interfaces when
          their change request goes through.
        evidence:
          keep: The interface list
          shows:
            - The date, and the job lists it was checked against
            - Source, target, owner and schedule for each interface
      - do: Decide what to compare for each one.
        how: >-
          Pick a record count and at least one control total, such as the sum of amounts, that both sides
          can produce, and decide how a second load of the same file or batch is stopped or caught, for
          example a batch ID the target refuses to load twice. The comparison is only as good as the fields
          it checks, so write them down.
        evidence:
          keep: The comparison definition for each interface
          shows:
            - The counts and totals compared, and where each side's figure comes from
            - How a duplicate load is stopped or detected
      - do: Compare every run.
        how: >-
          After each run, compare source and target counts and totals, automatically where you can, and
          explain any difference before the data is used.
        evidence:
          keep: The comparison result for each run in the period
          shows:
            - The period, and a run count that matches the scheduler's own run history
            - Source and target figures for each run, and the explanation of any difference
      - do: Make failures visible, and set how fast they're fixed.
        how: >-
          A failed, partial or missing run raises an alert to a queue someone watches, with cover. Each
          failure gets a ticket showing the cause, the fix and that the missing data was reloaded. Write
          the response time in your procedure.
        weigh:
          - How soon the receiving system or report needs the data
          - Who watches the alert, including out of hours
          - Whether the transfer tool can raise the alert itself, or a missing file has to be noticed by a separate check
        evidence:
          keep: The tickets for failed, partial or missing runs in the period
          shows:
            - The cause, the fix and when it was resolved
            - That the missing data was reloaded once, with the comparison for the reload
      - do: Work every rejected record.
        how: >-
          Records the target rejects are listed, then corrected and resent or closed with a reason.
          Write in your procedure how long a reject can stay open before it is escalated.
        weigh:
          - What a rejected record means for the financial data downstream
          - How many rejects usually appear, and who can work them
          - Whether a count of old rejects can be reported automatically
        evidence:
          keep: The reject list for the period
          shows:
            - The period, and a count that matches the target's own reject log
            - The outcome of each record, who worked it and when
      - do: Review it regularly.
        how: >-
          Someone who doesn't run the interface checks that every run has a comparison, differences were
          explained, rejects were closed or escalated, failures were resolved, and changes to the mapping
          went through change control.
        evidence:
          keep: The dated review, with notes on anything that slipped
          shows:
            - Who reviewed it, when, and the period they looked at
            - Each gap found and what was decided
      - do: Check it on each platform.
        how: >-
          For each platform that runs your interfaces, this says where to look, what good looks like and
          what to keep. Platform users run their own interfaces on it.
        checks:
          - platform: In-house job scheduler
            audience: Platform users
            where: The scheduler's run history for the job behind each interface, and the comparison result for each run.
            good:
              - Every run in the period has a comparison of record counts and at least one control total.
              - Any difference is explained before the data is used.
              - Every failed, partial or missing run has a ticket showing the cause, the fix and the reload.
              - The number of runs compared matches the run history.
            keep: The comparison result for each run in the period
            shows:
              - The period covered and where the run history came from
              - Source and target figures for each run, and the explanation of any difference
          - platform: SQL Server
            audience: Platform users
            where: SQL Server Agent job history for the job that sends or loads the data, and the target's batch or load log.
            good:
              - Every run in the period has a comparison of record counts and at least one control total.
              - A second load of the same file or batch is refused or caught.
              - Every record the target rejected has an outcome and the person who worked it.
            keep: The comparison result for each run, and the reject list for the period
            shows:
              - The period covered and the instance it came from
              - Source and target figures for each run, and the outcome of each rejected record
          - platform: Databricks
            audience: Platform users
            where: Workflows, then Jobs, then Runs, for the pipeline that moves the data, and the reconciliation output it writes.
            good:
              - Every run in the period has a comparison of record counts and at least one control total.
              - A rerun does not load the same batch twice.
              - Every failed or partial run has a ticket showing the cause, the fix and the reload.
            keep: The comparison result for each run in the period
            shows:
              - The period covered and the workspace it came from
              - Source and target figures for each run, and the explanation of any difference
    choosing_people:
      performer:
        - Runs or supports the interface and can get figures from both ends
        - Can correct and resend a rejected record, or knows who can
        - Knows what a normal run looks like, so an odd total stands out
      reviewer:
        - Doesn't run the interface or work its rejects
        - Relies on the data downstream, or understands it well enough to question a difference
      small_team: If one person runs the interface end to end, have a user of the receiving report check the comparisons for a sample of runs, and write that into your procedure.
