# Designing your controls: the risks and controls for this topic on TRAC, each found by its TRAC ID.
# The format of every field is described in content/controls/README.md.
# Check your changes with .\trac.ps1 check before syncing.

topic: Designing your controls

risks:
  - id: R-CD-01
    title: A control relies on a report that is incomplete or wrong
    statement: >-
      A control works from a report or data extract that is missing records or holds wrong values, so the
      review or reconciliation looks complete when it is not. This can happen when the source and filters
      are not recorded, the output is never compared with the source, or the query is edited without
      review. The result could be that the problem the control exists to catch, such as an unmatched
      change or a failed job, never appears on the list.
    owned_by: Control owner
    theme: Reports and data used in controls
    in_sox_scope: yes
    covered_by:
      - control: CD-01
        coverage: full
        why: The source and parameters are documented, completeness and accuracy are checked each run, and query changes go through change control.
controls:
  - id: CD-01
    title: Reports used in key controls are complete and accurate
    why: >-
      A control is only as good as the report it starts from: if the report leaves something out, the
      control never sees it. Checking the report when it is set up, each time it runs and after every
      change lets the team show the control worked on the full picture.
    applies_when:
      - A control starts from a report, dashboard, query or data extract, such as a user list, a list of changes or a list of job runs.
      - Someone could change the query, the filters or the source without the control owner knowing.
    nature: detective
    method: manual
    frequency: event
    level: supporting
    owned_by: Application owner
    performed_by: Report owner
    reviewed_by: Control owner
    theme: Reports and data used in controls
    categories: [application, database, operating_system, network, identity, cloud, jobs, engineering_tools, logging]
    steps:
      - do: List the reports your controls rely on.
        how: >-
          Go through each key control and note the report, query or extract it starts from. A control
          that starts from a spreadsheet someone maintains by hand needs a system source instead.
        evidence:
          keep: The list of reports, each with the control that uses it
          shows:
            - The date and who compiled it
            - Every key control, with its report or a note that it uses none
      - do: Write down where each report comes from.
        how: >-
          Record the source system and table or feed, the query or report definition, every filter and
          parameter, and each exclusion with a written reason. This is what lets someone else rerun it and
          get the same answer; [Documenting population exclusions](/guides/documenting-population-exclusions/)
          covers the exclusions.
        evidence:
          keep: The report description and the saved query
          shows:
            - The source, filters, parameters and exclusions with reasons
            - The date and who wrote it
      - do: Check completeness and accuracy each time it runs.
        how: >-
          Tie the record count or total to the source, taken a different way from the report itself, and
          trace a few rows back to the source record. Explain any difference before the control relies on
          the report.
        evidence:
          keep: The raw export, unedited, with its checks
          shows:
            - The date and time it ran, the system and the period it covers
            - The count from the report next to the count from the source
            - The rows traced and any difference explained
      - do: Protect the query from quiet edits.
        how: >-
          Only a small named group can change the query, report or source, and a change goes through
          change control with review by someone other than the author.
        evidence:
          keep: The list of who can edit the report, and its change history
          shows:
            - The date and the system the list came from
            - Each change with its request and reviewer
      - do: Recheck after every change.
        how: >-
          After the query, report or source changes, repeat the full completeness and accuracy checks
          before the next run is relied on.
        evidence:
          keep: The repeated checks, linked to the change
          shows:
            - The change they followed and the date
            - The counts compared and the rows traced
      - do: Review it regularly.
        how: >-
          The control owner confirms every run in the period had its checks, differences were explained
          and changes were rechecked, by comparing the runs against the control's own record.
        evidence:
          keep: The dated review
          shows:
            - Who reviewed it, when and the period they looked at
            - The number of runs checked against the control's record of runs
    choosing_people:
      performer:
        - Built or maintains the report, so knows the source and the filters
        - Can query the source a second way to tie the counts
      reviewer:
        - Didn't write or change the query
        - Relies on the report, so notices when a count looks wrong
        - Can read the query, or ask someone who can
      small_team: If the report owner also runs the control, have someone from another team rerun the source count for one run and record it.
