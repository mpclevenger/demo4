# Access management: the risks and controls for this topic on TRAC, each found by its TRAC ID.
# The format of every field is described in content/controls/README.md.
# Check your changes with .\trac.ps1 check before syncing.

topic: Access management

risks:
  - id: R-AM-01
    title: Inappropriate access is granted
    statement: >-
      A person is given access to a system or data that their job doesn't need. This can happen when a
      request is not approved, is approved by the wrong person, or is granted differently from what
      was approved. The result could be someone viewing, changing or moving financial or sensitive
      data without a business reason.
    owned_by: Application owner
    stage: Provisioning
    in_sox_scope: yes
    covered_by:
      - control: AM-02
        coverage: full
        why: Access is granted only from a recorded request approved by the manager and the owner, and what was granted is checked against it.
      - control: AM-01
        coverage: partial
        why: Documented roles give approvers a clear picture of what each job should and should not have.
      - control: AM-04
        coverage: partial
        why: Finds access that was granted without a proper approval or that no longer fits the job.

  - id: R-AM-02
    title: Privileged access, or the credentials and code that grant it, is misused or excessive
    statement: >-
      Someone uses administrator access, or the keys, credentials or code of a service that grants
      access, to change data, settings or other people's access, or to reach any account or role, by
      mistake or without authority. This can happen when privileged access is held by too many people,
      granted permanently, or used through everyday or shared accounts, or when a service's keys are
      never rotated or the code that grants access can be changed without review. The result could be
      wrong or unauthorized changes, or access well beyond what was approved, with no clear record of
      who made them.
    owned_by: Head of Engineering
    theme: Privileged access
    in_sox_scope: yes
    covered_by:
      - control: AM-03
        coverage: full
        why: Admin rights sit on separate named accounts, are time-limited where possible, and their use is logged and reviewed by someone independent.
      - control: AM-04
        coverage: partial
        why: Privileged access is reviewed on the schedule the Access Control Policy sets, so excess rights are found and removed.
      - control: AM-02
        coverage: partial
        why: Privileged access needs the same recorded approval as any other access.
      - control: AM-06
        coverage: partial
        why: Keys and credentials of service accounts and IAM users have an owner, tight limits and a rotation, so a leaked key is limited in what it reaches and how long it works.
      - control: CM-02
        coverage: partial
        why: Only the pipeline changes the code and settings that grant access, so they can't be altered by hand without review.

  - id: R-AM-03
    title: Access is not removed after someone leaves or moves
    statement: >-
      A person who has left, or moved to a job that no longer needs it, keeps access to systems or
      data. This can happen when access removal isn't triggered by HR events or isn't checked for
      timeliness. The result could be the access being used without authority, and staying open
      because nobody is looking for it.
    owned_by: Application owner
    stage: Deprovisioning
    in_sox_scope: yes
    covered_by:
      - control: AM-05
        coverage: full
        why: Access is removed when the HR event happens, timeliness is measured against a complete HR list, and a lookback checks for later activity where access stayed.
      - control: AM-04
        coverage: partial
        why: Catches accounts that belong to leavers or movers and were missed.
      - control: AM-06
        coverage: partial
        why: Service accounts have a named owner, so they are reassigned or closed when the owner leaves.

  - id: R-AM-04
    title: Access builds up over time without review
    statement: >-
      Access to systems and data builds up beyond what people need over time. This can happen when
      access isn't reviewed periodically against a complete list. The result could be excessive access
      and accounts that should have been closed staying hidden.
    owned_by: Application owner
    stage: Periodic review
    in_sox_scope: yes
    covered_by:
      - control: AM-04
        coverage: full
        why: Owners review a complete, system-generated list on a set schedule, and every removal is completed and evidenced.
      - control: AM-01
        coverage: partial
        why: A regular look at what each role grants stops roles from growing unnoticed.
      - control: AM-05
        coverage: partial
        why: Removes access at the moment a person moves, so less builds up between reviews.

  - id: R-AM-05
    title: Service accounts are misused or have no owner
    statement: >-
      A service account is used without anyone noticing, or has more rights than its job needs. This
      can happen when it has no owner, allows interactive sign-in, or its credentials are never
      rotated. The result could be misuse of the account's access, including by people who have since
      left.
    owned_by: Application owner
    theme: Service accounts
    in_sox_scope: yes
    covered_by:
      - control: AM-06
        coverage: full
        why: Each account has a named owner and purpose, no interactive sign-in, least privilege, vaulted and rotated credentials.
      - control: AM-04
        coverage: partial
        why: Service accounts are in the key periodic review, with owner and purpose shown, so unowned or excessive ones are found.
      - control: AM-03
        coverage: partial
        why: Service accounts with administrator rights follow the privileged access rules too.

  - id: R-AM-06
    title: One person holds conflicting duties
    statement: >-
      One person can carry out and approve the same action, or holds access that should be split
      between people, such as developing code and writing to production. This can happen when
      conflicting combinations aren't defined or checked. The result could be an error or fraud going
      through without a second person seeing it.
    owned_by: Head of Engineering
    theme: Segregation of duties
    in_sox_scope: yes
    covered_by:
      - control: AM-07
        coverage: full
        why: Conflicting combinations are defined, checked when access is granted and monitored afterward with a documented mitigating review.
      - control: AM-01
        coverage: partial
        why: Conflicting permissions are identified when roles are designed, so roles are not built with a conflict inside them.
      - control: AM-03
        coverage: partial
        why: Developers do not hold production write access, and secondary admin accounts are checked for.

  - id: R-AM-07
    title: Accounts are taken over because sign-in is weak or can be bypassed
    statement: >-
      Someone gets into a system as another person, or from outside the firm's network. They might use
      a stolen or guessed password, use a way in that skips multi-factor sign-in, or rely on a sign-in
      service that vouches for the wrong person. This can happen when sign-in does not go through
      single sign-on, multi-factor sign-in is not required on every way in to privileged and remote
      access (including command-line and service sign-ins), a service that issues sign-in tokens is not
      itself tightly controlled, or local accounts keep weak password and lockout settings. The result
      could be unauthorized access to financial or sensitive data, recorded under someone else's name.
    owned_by: Application owner
    theme: Authentication
    in_sox_scope: yes
    covered_by:
      - control: AM-08
        coverage: full
        why: Sign-in goes through single sign-on where available, privileged and remote access need multi-factor sign-in, and local accounts have enforced password and lockout settings.
      - control: AM-03
        coverage: partial
        why: Administrator accounts are separate, named and protected by multi-factor sign-in.
controls:
  - id: AM-01
    title: Roles are documented with their permissions
    why: >-
      Nobody can judge whether access is right if nobody knows what a role is meant to allow. Written
      roles give approvers and reviewers something to compare against, and they show risky permissions
      before anyone is given them.
    applies_when:
      - The system controls access through roles, groups or permission sets.
      - More than one person approves or reviews access to it.
    nature: preventive
    method: manual
    frequency: annual
    level: supporting
    owned_by: Application owner
    performed_by: Role owner
    reviewed_by: Control owner
    stage: Roles to permissions
    categories: [application, database, operating_system, identity, cloud, engineering_tools]
    references:
      - label: "Worked example, part 1: a quarterly access review"
        link: /guides/worked-example-1-access-review/
    steps:
      - do: List every role.
        how: >-
          Pull the roles, groups and permission sets from the system itself, not from an old document,
          so none is missed. Include built-in roles and ones nobody seems to use.
        evidence:
          keep: The list of roles and what each grants, exported from the system
          shows:
            - The date it was pulled and the system it came from
            - Every role, with the permissions it actually grants
        commands:
          - platform: SQL Server
            note: Permissions granted to each database role. Run it in each database.
            code: |
              SELECT r.name AS role_name, p.class_desc,
                     CASE p.class WHEN 1 THEN OBJECT_NAME(p.major_id)
                                  WHEN 3 THEN SCHEMA_NAME(p.major_id) END AS object_name,
                     p.permission_name, p.state_desc
              FROM sys.database_permissions AS p
              JOIN sys.database_principals AS r ON r.principal_id = p.grantee_principal_id
              WHERE r.type = 'R'
              ORDER BY r.name, p.permission_name;
          - platform: Databricks
            note: Who holds which privilege on a catalog. Replace <catalog name>; use ON SCHEMA or ON TABLE for lower levels.
            code: |
              SHOW GRANTS ON CATALOG <catalog name>;
          - platform: AWS
            note: The managed and inline policies attached to one IAM role. Replace <role name>.
            code: |
              aws iam list-attached-role-policies --role-name <role name>
              aws iam list-role-policies --role-name <role name>
      - do: Describe what each role is for.
        how: >-
          For each role, write the job it serves, what it lets someone do in words a reviewer can follow,
          and the owner who decides who may hold it. A reviewer who can't read the permissions can't
          question them.
        evidence:
          keep: The role documentation
          shows:
            - Each role's job, permissions in plain words and owner
            - The date it was written and who wrote it
      - do: Mark the privileged and conflicting permissions.
        how: >-
          Flag anything that grants administrator power, such as Domain Admins, SQL Server sysadmin or
          db_owner, local Administrators, cloud and cluster administrator rights, or GitHub Enterprise
          Server site admin. Note pairs of roles one person shouldn't hold together; the privileged
          access and segregation of duties controls start from these marks.
      - do: Compare the documentation with what the system grants.
        how: >-
          Put the export from the first step next to the documentation and fix every difference, in the
          system or in the document. Comparing from memory misses the permission someone added quietly.
        evidence:
          keep: The comparison, with a note on each difference and how it was fixed
          shows:
            - The date and the export it was compared with
            - Each difference and its outcome
      - do: Update it when a role changes.
        how: >-
          When a role is created, changed or retired, the documentation changes before the role is used,
          as part of the same change request.
        evidence:
          keep: The updated documentation and the change request behind it
          shows:
            - The role, what changed and the date
            - The request it came from
      - do: Review it regularly.
        how: >-
          The Access Control Policy sets how often the documentation is reviewed against what the roles
          grant. Someone other than the person who maintains the roles checks the comparison and signs off.
        policy: "[Access Control Policy](#todo-access-control-policy)"
        evidence:
          keep: The signed-off review
          shows:
            - Who reviewed it and when
            - Which comparison they looked at and what they decided
      - do: Check it on each platform.
        how: >-
          For each platform, this says where to look, what good looks like and what to keep.
          Platform admins run the platform; Platform users own the controls over their own use.
        checks:
          - platform: SQL Server
            audience: Platform users
            where: Security, then Roles, in each database in SQL Server Management Studio, or the query for this platform.
            good:
              - Every role in the list has a written job and a named owner.
              - Each role's written permissions match what the export shows it grants.
              - Roles with administrator power, such as db_owner, are marked.
            keep: The role list and the documentation, side by side
            shows:
              - The date it was pulled and the instance it came from
              - Each difference and how it was settled
          - platform: Databricks
            audience: Platform users
            where: Catalog Explorer, then the Permissions tab of each catalog, and the workspace's group list.
            good:
              - Every group that holds a privilege has a written purpose and a named owner.
              - The documented privileges match what the Permissions tab shows.
              - Broad privileges, such as ALL PRIVILEGES or MANAGE, are marked.
            keep: The grants export for each catalog, with the role documentation
            shows:
              - The date and the workspace it came from
              - Each difference and how it was settled
          - platform: AWS
            audience: Platform users
            where: IAM, then Roles and Policies, in the account's console.
            good:
              - Every role your team uses has a written purpose and a named owner.
              - The policies attached to each role match the documentation.
              - Roles with administrator rights are marked.
            keep: The list of roles and their attached policies, with the documentation
            shows:
              - The date and the account it came from
              - Each difference and how it was settled
          - platform: Active Directory
            audience: Platform admins
            where: Active Directory Users and Computers, the security groups, and the Managed By field on each.
            good:
              - Every group that grants access to a system has a description and a named owner.
              - The privileged groups, such as Domain Admins, are marked as privileged.
              - No group in the list is unexplained.
            keep: A dated export of the groups with their owners and descriptions
            shows:
              - The date and the domain it came from
              - Which groups are marked privileged
          - platform: Entra ID
            audience: Platform admins
            where: Entra admin center, then Roles and administrators, and Groups.
            good:
              - Every directory role in use has a named owner who decides who may hold it.
              - The powerful roles, such as Global Administrator, are marked.
              - Roles assigned to groups list who may add members.
            keep: A dated export of the role assignments
            shows:
              - The date and the tenant it came from
              - The owner of each role
    choosing_people:
      performer:
        - Owns the role or the system it lives in
        - Knows what each job actually needs to do
        - Can export what a role grants without help
      reviewer:
        - Doesn't maintain the roles
        - Understands the system well enough to question a broad permission
        - Approves or reviews access to the system, so relies on the documentation
      small_team: If the role owner is the only one who knows the system, have the system owner's manager review a sample of roles and their exports.

  - id: AM-02
    title: Access is granted only from an approved request
    why: >-
      Access handed out informally is impossible to defend later. When every grant traces back to a
      recorded approval, the team can show who said yes and why, and checking what was granted against
      what was approved catches setup mistakes.
    applies_when:
      - People are given new access, or have their access changed, on the system or its data.
    nature: preventive
    method: it_dependent
    frequency: event
    level: key
    owned_by: Application owner
    performed_by: Access administrator
    reviewed_by: Control owner
    stage: Provisioning
    categories: [application, database, operating_system, identity, cloud, engineering_tools]
    references:
      - label: "Worked example, part 1: a quarterly access review"
        link: /guides/worked-example-1-access-review/
    steps:
      - do: Set up one way to ask for access.
        how: >-
          Every request goes through a ticket or request tool that records the person, the role or group
          wanted and the reason. A request for something other than a documented role says why.
        evidence:
          keep: The request form or workflow settings
          shows:
            - The date and the tool it is in
            - That it captures the person, the access wanted and the reason
      - do: Get two approvals before anything is granted.
        how: >-
          The person's manager confirms the access fits the job, and the owner of the system or data
          confirms it may be given. Nobody approves their own request, and contractor and vendor access
          gets an end date when it is approved.
        evidence:
          keep: The approved request
          shows:
            - Who approved it and when, before the grant
            - What was approved and, for contractors, the end date
      - do: Grant exactly what was approved.
        how: >-
          The person who grants the access didn't request or approve it. They give what was approved and
          nothing more, remove access a mover no longer needs in the same request, and link the change to
          the request.
        evidence:
          keep: The system's record of the grant, linked to the request
          shows:
            - What was granted, by whom and when
            - The request number it matches
      - do: Compare grants with approved requests.
        how: >-
          Take the list of grants for the period from the system's own audit log, not from the ticket
          tool, so a grant made without a ticket still shows up. Match each grant to a request and
          investigate any that has none. The Access Control Policy sets how often this runs.
        policy: "[Access Control Policy](#todo-access-control-policy)"
        evidence:
          keep: The list of grants for the period and the match against requests
          shows:
            - The period covered and the query or search that produced the list
            - A count that ties to the audit log
            - Each unmatched grant and what was found
        commands:
          - platform: Databricks
            note: Unity Catalog grant changes and group additions in a date range. Replace the dates.
            code: |
              SELECT event_time, user_identity.email AS changed_by,
                     service_name, action_name, request_params
              FROM system.access.audit
              WHERE event_date >= '<start date>' AND event_date < '<end date>'
                AND action_name IN ('updatePermissions', 'addPrincipalToGroup')
              ORDER BY event_time;
          - platform: Splunk
            note: Users added to Active Directory groups (events 4728, 4732 and 4756 from domain controllers). Replace the index and dates.
            code: |
              index=<windows security index> EventCode IN (4728, 4732, 4756)
                earliest="<start date, MM/DD/YYYY:00:00:00>" latest="<end date, MM/DD/YYYY:00:00:00>"
              | table _time, host, EventCode, _raw
      - do: Review it regularly.
        how: >-
          The control owner checks that unmatched grants were explained or removed, and that nobody
          approved or granted their own access.
        evidence:
          keep: The dated sign-off on the comparison
          shows:
            - Who reviewed it, when and the period they looked at
            - What they decided on each open item
      - do: Check it on each platform.
        how: >-
          For each platform, this says where to look, what good looks like and what to keep.
          Platform admins run the platform; Platform users own the controls over their own use.
        checks:
          - platform: SQL Server
            audience: Platform users
            where: Security, then Logins and the database role members, in SQL Server Management Studio, or the server's audit records.
            good:
              - Every login or role membership added in the period has an approved request.
              - The access granted is what the request asked for, no more.
              - The requester is not the approver, and the owner of the system approved it.
            keep: The list of grants for the period, matched to the requests
            shows:
              - The period covered and the instance it came from
              - For each grant, its request and its approvers
          - platform: Databricks
            audience: Platform users
            where: Catalog Explorer permissions, and the grant changes and group additions in the audit logs, or the query for this platform.
            good:
              - Every grant or group addition in the period has an approved request.
              - The grant matches the request.
              - Any grant with no request is listed, with what was decided.
            keep: The list of grant changes for the period, matched to the requests
            shows:
              - The period and the workspace it came from
              - For each change, its request and its approvers
          - platform: AWS
            audience: Platform users
            where: IAM Identity Center assignments, IAM policy attachments, and the matching events in CloudTrail.
            good:
              - Every access added in the period has an approved request.
              - The permissions given match the request.
              - Access added with no request is listed, with what was decided.
            keep: The list of access added for the period, matched to the requests
            shows:
              - The period and the account it came from
              - For each addition, its request and its approvers
          - platform: Active Directory
            audience: Platform admins
            where: The domain controllers' group membership changes, searched in Splunk, or the query for this platform.
            good:
              - Every addition to a group that grants access has an approved request.
              - The person who made the change is not the person who requested it.
              - Every addition with no request is listed, with what was decided.
            keep: The list of group additions for the period, matched to the requests
            shows:
              - The period covered and the domain it came from
              - For each addition, its request and who made it
          - platform: Entra ID
            audience: Platform admins
            where: Entra admin center, then Audit logs, filtered to group and role changes.
            good:
              - Every group or role change in the period has an approved request.
              - Changes made by an administrator on their own behalf are listed.
              - Every change with no request is listed, with what was decided.
            keep: The audit log export for the period, matched to the requests
            shows:
              - The period and the tenant it came from
              - For each change, its request and who made it
    choosing_people:
      performer:
        - Has the rights to grant access on the system, and nothing to gain from a particular grant
        - Knows the roles well enough to spot a request that asks for too much
      reviewer:
        - Doesn't grant access on the system
        - Can read the audit log or knows who can pull it
        - Has the standing to have an unapproved grant removed
      small_team: If the administrator is also the only reviewer, have the system owner review the comparison and sign it.

  - id: AM-03
    title: Privileged access is limited and controlled
    why: >-
      Administrator rights can change data, settings and other people's access. Keeping them few, on
      separate named accounts and logged limits what a mistake or a stolen password can do, and shows
      afterward who did what.
    applies_when:
      - People or tools hold administrator or other privileged rights on a system, database, server, cloud account, cluster or tool.
      - Developers can write to production in any way.
    nature: preventive
    method: it_dependent
    frequency: event
    level: key
    owned_by: Head of Engineering
    performed_by: Platform engineer
    reviewed_by: Control owner
    theme: Privileged access
    categories: [application, database, operating_system, identity, cloud, engineering_tools, logging]
    steps:
      - do: List who holds privileged access.
        how: >-
          Start from the privileged roles marked in the role documentation and pull their members from
          each system. Expand groups down to people, because a nested group is where extra admins hide.
        evidence:
          keep: The list of privileged roles and their members
          shows:
            - The date it was pulled and the system it came from
            - Each member down to the person, including members of nested groups
        commands:
          - platform: SQL Server
            note: Server role members, then anyone granted CONTROL SERVER (which acts like sysadmin).
            code: |
              SELECT r.name AS server_role, m.name AS member, m.type_desc, m.is_disabled
              FROM sys.server_role_members AS rm
              JOIN sys.server_principals AS r ON r.principal_id = rm.role_principal_id
              JOIN sys.server_principals AS m ON m.principal_id = rm.member_principal_id
              ORDER BY r.name, m.name;

              SELECT p.name, p.type_desc
              FROM sys.server_permissions AS sp
              JOIN sys.server_principals AS p ON p.principal_id = sp.grantee_principal_id
              WHERE sp.permission_name = 'CONTROL SERVER' AND sp.state IN ('G', 'W');
          - platform: Active Directory
            audience: Platform admins
            note: Members of the main domain admin groups, with nested groups expanded. Add your own admin groups to the list.
            code: |
              foreach ($g in 'Domain Admins', 'Enterprise Admins', 'Schema Admins', 'Administrators') {
                Get-ADGroupMember -Identity $g -Recursive |
                  Select-Object @{n='Group'; e={$g}}, Name, SamAccountName, objectClass
              }
          - platform: Entra ID
            audience: Platform admins
            note: Everyone active in each Entra directory role. People only eligible through Privileged Identity Management show in PIM, not here.
            code: |
              Get-MgDirectoryRole -All | ForEach-Object {
                $role = $_.DisplayName
                Get-MgDirectoryRoleMember -DirectoryRoleId $_.Id -All |
                  Select-Object @{n='Role'; e={$role}}, Id,
                    @{n='Name'; e={$_.AdditionalProperties.displayName}}
              }
      - do: Give admin work its own named accounts.
        how: >-
          Each administrator has a separate account for admin work, tied to one person, protected by
          multi-factor sign-in and never used for email or browsing. A shared emergency account, if one
          must exist, is sealed in the vault and every use is logged and explained.
        evidence:
          keep: The list of admin accounts, each matched to its owner
          shows:
            - The date and the system it came from
            - The person behind each account, and any shared account with its reason
      - do: Make admin rights temporary where the platform allows.
        how: >-
          Use time-limited elevation where it exists, such as Privileged Identity Management in Entra ID
          or IAM Identity Center in AWS, so rights end on their own. Developers don't keep standing write
          access to production; when they need it, it is approved, time-limited and looked at afterward.
        evidence:
          keep: The elevation settings and the list of standing admin rights that remain
          shows:
            - The date and the system
            - A reason for each standing right
        commands:
          - platform: Kubernetes
            note: Who is bound to cluster-wide and namespace roles (look for cluster-admin and edit rights in production).
            code: |
              kubectl get clusterrolebindings -o wide
              kubectl get rolebindings --all-namespaces -o wide
          - platform: Windows Server
            audience: Platform admins
            note: Local Administrators on a member server. Run it on each server (it doesn't work on domain controllers).
            code: |
              Get-LocalGroupMember -Group Administrators
          - platform: GitHub Enterprise Server
            audience: Platform admins
            note: Organization owners. Replace <ghes host> and <org>.
            code: |
              gh api --hostname <ghes host> "/orgs/<org>/members?role=admin" --paginate --jq '.[].login'
      - do: Log what administrators do.
        how: >-
          Privileged sessions and actions go to Splunk or another log the administrators can't change.
          Without that, nobody can say afterward who made a change.
        evidence:
          keep: The logging settings and one sample event
          shows:
            - The date, the system and where the log is sent
            - That the event names the account and the action
      - do: Review who holds it.
        how: >-
          The Access Control Policy sets how often privileged access is reviewed. Remove what isn't
          needed, look for people who hold a second admin account (match accounts by employee ID or name,
          not by username) and for developers with production write access.
        policy: "[Access Control Policy](#todo-access-control-policy)"
        evidence:
          keep: The reviewed list with a decision on each line, and tickets for removals
          shows:
            - Who reviewed it, when, and the list's date and system
            - Each decision, including second accounts found
      - do: Review what administrators did.
        how: >-
          Someone who isn't one of the administrators in the log compares privileged activity with
          approved changes and requests, and investigates anything unexpected. If the reviewer appears in
          the log, someone else checks their entries.
        evidence:
          keep: The log extract with a note on each item
          shows:
            - The period and the search that produced it, with its event count
            - Who reviewed it, when and what they concluded
      - do: Check it on each platform.
        how: >-
          For each platform, this says where to look, what good looks like and what to keep.
          Platform admins run the platform; Platform users own the controls over their own use.
        checks:
          - platform: SQL Server
            audience: Platform users
            where: Security, then Server Roles, in SQL Server Management Studio, or the query for this platform.
            good:
              - Every member of sysadmin and db_owner is a named person or a documented account.
              - Each member has an approved request and a reason.
              - Administrators use separate accounts for administrator work, not shared ones.
            keep: The list of privileged members, with the approval for each
            shows:
              - The date and the instance it came from
              - The approver and the reason for each member
          - platform: Windows Server
            audience: Platform admins
            where: Computer Management, then Local Users and Groups, then Administrators, on each server.
            good:
              - Every member of local Administrators is a named person or a documented account.
              - Each has an approved reason.
              - No everyday account is a member.
            keep: The members of local Administrators for each server
            shows:
              - The date and the server it came from
              - The approver and the reason for each member
          - platform: Active Directory
            audience: Platform admins
            where: Active Directory Users and Computers, the members of Domain Admins, Enterprise Admins and your other admin groups.
            good:
              - The groups have only named individuals, in a number the owner can explain.
              - Each member has a separate admin account and an approved reason.
              - Nested groups are expanded and checked too.
            keep: A dated list of the members of each admin group, nested groups expanded
            shows:
              - The date and the domain it came from
              - The approver for each member
          - platform: Entra ID
            audience: Platform admins
            where: Entra admin center, then Roles and administrators, and Privileged Identity Management.
            good:
              - Every active holder of a powerful role is a named person with an approved reason.
              - Rights are held through Privileged Identity Management where the platform allows, not permanently.
              - Break-glass accounts are listed, protected and watched.
            keep: The active and eligible role assignments
            shows:
              - The date and the tenant it came from
              - The approver for each assignment
          - platform: AWS
            audience: Platform admins
            where: IAM, then the users, roles and groups with administrator policies, and IAM Identity Center permission sets.
            good:
              - Every identity with administrator rights is named, with an approved reason.
              - Administrators use roles and temporary access where the platform allows.
              - The root user is locked down and has not been used for everyday work.
            keep: The list of identities with administrator rights
            shows:
              - The date and the account it came from
              - The approver for each identity
          - platform: Kubernetes
            audience: Platform admins
            where: The cluster role bindings, especially cluster-admin, and who can reach the control plane.
            good:
              - Every subject bound to cluster-admin is a named person or a documented group.
              - Each has an approved reason.
              - Nothing is bound to cluster-admin that nobody can explain.
            keep: A dated export of the cluster-wide role bindings
            shows:
              - The date and the cluster it came from
              - The approver for each binding
          - platform: Kubernetes
            audience: Platform users
            where: The role bindings in your team's namespaces.
            good:
              - People with edit or admin rights in production are named and approved.
              - Developers have no write access to production beyond what was approved.
              - Each binding has an owner.
            keep: The role bindings for your namespaces, with the approval for each
            shows:
              - The date and the cluster it came from
              - The approver for each binding
          - platform: GitHub Enterprise Server
            audience: Platform admins
            where: Site admin, then the list of site administrators, and each organization's owners.
            good:
              - Site administrators and organization owners are named, with approved reasons.
              - The list is short enough that the owner can explain every name.
              - Administrators use a separate account for administrator work.
            keep: The list of site administrators and organization owners
            shows:
              - The date and the server it came from
              - The approver for each person
          - platform: Splunk
            audience: Platform admins
            where: Splunk, then the roles, the indexes holding administrator logs and who can edit or delete them.
            good:
              - Administrator actions on the systems above reach Splunk.
              - Administrators can't change or delete the logs of their own actions.
              - An alert fires if a feed stops.
            keep: A dated export of the roles and index settings, and a sample of administrator events
            shows:
              - The date and the Splunk stack
              - Who can edit or delete the logs
    choosing_people:
      performer:
        - Administers the platform and can see every privileged group on it
        - Knows which admin accounts belong to which people
        - Can set up elevation and logging on the platform
      reviewer:
        - Holds no admin rights on the system being reviewed
        - Knows enough about the work to tell a routine admin action from an odd one
        - Can get a removal done without asking the admins' permission
      small_team: If every engineer is an admin, have someone from another team review the activity log and the list, and write that into your procedure.

  - id: AM-04
    title: Periodic user access review
    why: >-
      Access piles up as people move and systems change, even when provisioning works well. A review by
      people who know the jobs finds what is no longer needed, and it only counts if the list is
      complete and every removal is carried through.
    applies_when:
      - People or service accounts have access to the system.
    nature: detective
    method: it_dependent
    frequency: quarterly
    level: key
    owned_by: Application owner
    performed_by: Reviewer
    reviewed_by: Control owner
    stage: Periodic review
    categories: [application, database, operating_system, identity, cloud, engineering_tools]
    references:
      - label: "Worked example, part 1: a quarterly access review"
        link: /guides/worked-example-1-access-review/
    steps:
      - do: Pull the full list from the system.
        how: >-
          Export every account and what it holds straight from the system, including service, privileged,
          vendor and disabled accounts. Expand groups to the people in them, and add each person's job or
          manager and their last sign-in so the reviewer has something to judge by.
        evidence:
          keep: The access list
          shows:
            - The date and time it was pulled and the system it came from
            - Every account with its access, its job or manager and its last sign-in
        commands:
          - platform: SQL Server
            note: Every login on the instance, then the database role members (run that part in each database). Windows groups need expanding in Active Directory.
            code: |
              SELECT name, type_desc, is_disabled, create_date, modify_date
              FROM sys.server_principals
              WHERE type IN ('S', 'U', 'G', 'E', 'X')
              ORDER BY name;

              SELECT r.name AS db_role, m.name AS member, m.type_desc
              FROM sys.database_role_members AS rm
              JOIN sys.database_principals AS r ON r.principal_id = rm.role_principal_id
              JOIN sys.database_principals AS m ON m.principal_id = rm.member_principal_id
              ORDER BY r.name, m.name;
          - platform: Active Directory
            note: The people in a group that grants access, with nested groups expanded. LastLogonTimestamp is only updated periodically, so it can be days behind. Replace <group name>.
            code: |
              Get-ADGroupMember -Identity "<group name>" -Recursive |
                Where-Object objectClass -eq 'user' |
                Get-ADUser -Properties Enabled, LastLogonTimestamp, Title, Manager |
                Select-Object SamAccountName, Name, Enabled, Title, Manager,
                  @{n='LastLogon'; e={ if ($_.LastLogonTimestamp) { [DateTime]::FromFileTime($_.LastLogonTimestamp) } }}
          - platform: AWS
            note: The IAM credential report for the account, saved as CSV (IAM users only; IAM Identity Center users and roles are listed separately).
            code: |
              aws iam generate-credential-report
              $b64 = aws iam get-credential-report --query Content --output text
              [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($b64)) | Out-File credential-report.csv
      - do: Check the list is complete before anyone reviews it.
        how: >-
          Compare the count with the system another way, such as a count from the admin console or a
          second query, and look for access that bypasses the main list, like local SQL logins or IAM
          users next to single sign-on. A review of a partial list passes nothing.
        evidence:
          keep: The completeness check
          shows:
            - The two counts and where each came from
            - Who did the check and when
      - do: Send each line to someone who knows the job.
        how: >-
          The reviewer is the person's manager or the owner of the system or data. Nobody reviews their
          own access; move those lines to someone else before the review starts.
        evidence:
          keep: The list of reviewers and the lines each one got
          shows:
            - That every line has a reviewer
            - That no reviewer has their own access on their list
      - do: Get a keep or remove decision on every line.
        how: >-
          Each reviewer records their own decision in the review tool or in a file sent from their own
          account, so it traces to them. The Access Control Policy sets how often the review runs, how
          long it may take and when an unused account is disabled. A late review is recorded as late,
          with the reason.
        policy: "[Access Control Policy](#todo-access-control-policy)"
        evidence:
          keep: The completed list with each reviewer's decisions
          shows:
            - Who decided each line and when
            - A decision on every line, with a reason for keeping unused or privileged access
      - do: Remove what was marked, and show it's gone.
        how: >-
          Each removal becomes a ticket. After the work is done, pull a fresh list and confirm the access
          is gone; a ticket closed without that check proves nothing.
        evidence:
          keep: The removal tickets and a fresh extract after the removals
          shows:
            - Each removal with its ticket and the date it was done
            - The date and system of the fresh extract, with the removed access absent
      - do: Sign off the review.
        how: >-
          The control owner checks that the list was complete, every line has a decision, nobody reviewed
          themselves and every removal is done. Overdue removals are chased until closed.
        evidence:
          keep: The sign-off
          shows:
            - Who signed off and when
            - The review period and any open items with their status
      - do: Check it on each platform.
        how: >-
          For each platform, this says where to look, what good looks like and what to keep.
          Platform admins run the platform; Platform users own the controls over their own use.
        checks:
          - platform: SQL Server
            audience: Platform users
            where: Security, then Logins and the database role members, in SQL Server Management Studio, or the query for this platform.
            good:
              - The list was pulled from the instance, and its count matches the list sent to reviewers.
              - Every line has a keep or remove decision from someone who knows the job.
              - Every line marked for removal is gone, shown by a new pull.
            keep: The pulled list, the decisions and the new pull after removals
            shows:
              - The date and the instance it came from
              - The reviewer for each line and the date of each decision
          - platform: Databricks
            audience: Platform users
            where: The account console and workspace, Users and Groups, and each catalog's Permissions tab.
            good:
              - The list was pulled from the platform, not from memory.
              - Every user, group and grant has a decision.
              - Every removal is confirmed in a new pull.
            keep: The pulled list, the decisions and the new pull after removals
            shows:
              - The date and the workspace it came from
              - The reviewer for each line and the date of each decision
          - platform: AWS
            audience: Platform users
            where: IAM, then Credential report, and the IAM Identity Center assignments.
            good:
              - The report covers every identity in the account, and its count matches what reviewers got.
              - Every line has a keep or remove decision.
              - Unused keys and users are on the list for removal.
            keep: The credential report, the decisions and a new report after removals
            shows:
              - The date and the account it came from
              - The reviewer for each line and the date of each decision
          - platform: Active Directory
            audience: Platform users
            where: The members of the groups that grant access to your systems, with nested groups expanded.
            good:
              - The list was pulled from the directory with a visible run date.
              - Every member has a keep or remove decision from someone who knows the job.
              - Every removal shows in a new pull.
            keep: The pulled group lists, the decisions and a new pull after removals
            shows:
              - The date and the domain it came from
              - The reviewer for each line and the date of each decision
          - platform: Active Directory
            audience: Platform admins
            where: The members of the privileged groups, such as Domain Admins, and the other directory-wide groups.
            good:
              - The privileged groups are reviewed by someone who doesn't hold the access.
              - Every member has a keep or remove decision.
              - Removals show in a new pull.
            keep: The pulled privileged group lists, the decisions and a new pull
            shows:
              - The date and the domain it came from
              - The reviewer and the date of each decision
          - platform: Entra ID
            audience: Platform admins
            where: Entra admin center, then Roles and administrators, Groups and Access reviews.
            good:
              - Directory roles and the groups that grant access are reviewed on the schedule the Access Control Policy sets.
              - Every holder has a decision.
              - Removals show in a new pull.
            keep: The review results and the role assignments after removals
            shows:
              - The date and the tenant it came from
              - The reviewer and the date of each decision
    choosing_people:
      performer:
        - Manages the people on their list or owns the system or data
        - Knows what each person's job needs well enough to say no
        - Has time set aside to finish the review
      reviewer:
        - Doesn't appear on the list being reviewed
        - Can check the completeness test and the fresh extract, not just the decisions
        - Has the standing to chase overdue removals
      small_team: If a manager would have to review their own access, have their manager review those lines and note it on the list.

  - id: AM-05
    title: Leavers and movers lose access on time
    why: >-
      Access left open after someone leaves or changes job is an easy way in that nobody is watching.
      Starting removal from the HR event and measuring how fast it happened shows the gap is closed, and
      a lookback shows whether it was used.
    applies_when:
      - People with access to the system leave the firm or move to another job.
      - Contractors or vendor staff with access finish their work.
    nature: preventive
    method: it_dependent
    frequency: event
    level: key
    owned_by: Application owner
    performed_by: Access administrator
    reviewed_by: Control owner
    stage: Deprovisioning
    categories: [application, database, operating_system, identity, cloud, engineering_tools]
    references:
      - label: "Worked example, part 1: a quarterly access review"
        link: /guides/worked-example-1-access-review/
    steps:
      - do: Get the leaver and mover list from HR.
        how: >-
          Removal starts from the HR event, not from someone remembering. The list includes contractors
          and vendor staff, and it ties to HR's own count for the period, so nobody falls through.
        evidence:
          keep: The HR list of leavers and movers for the period
          shows:
            - The period and the HR system it came from
            - A count that matches HR's own total, including contractors
      - do: Remove access when the HR event arrives.
        how: >-
          Disable the directory account and end open cloud sign-in sessions. Then remove access that
          doesn't depend on the directory: local database logins, AWS IAM users and keys, personal access
          tokens, SSH keys and tool accounts. The Access Control Policy sets how fast this happens.
        policy: "[Access Control Policy](#todo-access-control-policy)"
        evidence:
          keep: The ticket and the system record of each removal
          shows:
            - The person, the HR date and the date and time access was removed
            - Each system covered, including access outside the directory
      - do: For movers, take away what the new job doesn't need.
        how: >-
          Compare the old access with the new job and remove the rest. If some old access stays for a
          handover or cross-training, write down the reason and when it ends. The Access Control Policy
          sets how fast the rest goes.
        policy: "[Access Control Policy](#todo-access-control-policy)"
        evidence:
          keep: The removal record, or the written reason for keeping access
          shows:
            - The person, the move date and what was removed or kept
            - Who approved anything kept, and until when
      - do: Match the HR list to the removals.
        how: >-
          For every person on the HR list, find the removal and measure it against the HR date and the
          time the Access Control Policy sets. A person with no removal is a miss, not a gap in the data.
        policy: "[Access Control Policy](#todo-access-control-policy)"
        evidence:
          keep: The comparison, with the time taken for each person
          shows:
            - The period, with a count that matches the HR list
            - Each late or missed removal, with the reason and what was done
        commands:
          - platform: Splunk
            note: Active Directory accounts disabled in a date range (event 4725), to get the removal time. Replace the index and dates.
            code: |
              index=<windows security index> EventCode=4725
                earliest="<start date, MM/DD/YYYY:00:00:00>" latest="<end date, MM/DD/YYYY:00:00:00>"
              | table _time, host, _raw
      - do: Look back where access stayed too long.
        how: >-
          When access was removed late, or old access stayed with no written handover reason, check
          sign-ins and activity after the leave or move date and investigate anything found. Where a
          documented handover reason exists, that reason is the evidence and no lookback is needed.
        evidence:
          keep: The activity search for each person and a note on what was found
          shows:
            - The person, the dates searched and the systems covered
            - The search used, its results and the conclusion
        commands:
          - platform: Entra ID
            audience: Platform admins
            note: Sign-ins by one user since a date. Entra keeps sign-in logs only for a limited time, so use Splunk for older ones. Replace the UPN and date.
            code: |
              Get-MgAuditLogSignIn -All -Filter "userPrincipalName eq '<upn>' and createdDateTime ge <leave date>T00:00:00Z" |
                Select-Object CreatedDateTime, AppDisplayName, IpAddress
          - platform: Splunk
            note: Windows sign-ins (event 4624) mentioning the account after the leave date. Replace the index, account and date.
            code: |
              index=<windows security index> EventCode=4624 "<account name>"
                earliest="<leave date, MM/DD/YYYY:00:00:00>"
              | table _time, host, _raw
          - platform: AWS
            note: Recent CloudTrail management events by an IAM user name; older events are in the trail's own store or Splunk. Replace <user name>.
            code: |
              aws cloudtrail lookup-events --lookup-attributes AttributeKey=Username,AttributeValue=<user name>
      - do: Check it on each platform.
        how: >-
          For each platform, this says where to look, what good looks like and what to keep.
          Platform admins run the platform; Platform users own the controls over their own use.
        checks:
          - platform: Active Directory
            audience: Platform admins
            where: Active Directory Users and Computers, the account disabled dates, and the disabled-account events in Splunk.
            good:
              - Every leaver on the HR list has a disabled account, and the date is within the time the Access Control Policy sets.
              - Every mover has had the access of the old job removed.
              - Any leaver whose account stayed open is listed, with why.
            keep: The HR list matched to the account dates
            shows:
              - The period covered and the domain it came from
              - The leave date and removal date for each person
          - platform: Entra ID
            audience: Platform admins
            where: Entra admin center, then Users, and the sign-in logs for each leaver.
            good:
              - Every leaver's account is disabled or removed within the time the Access Control Policy sets.
              - No leaver signed in after the leave date, or the sign-in is explained.
              - Guest accounts of people who left are removed.
            keep: The HR list matched to the account dates, and the sign-in check
            shows:
              - The period and the tenant it came from
              - The leave date and removal date for each person
          - platform: SQL Server
            audience: Platform users
            where: Security, then Logins, and the database role members, in SQL Server Management Studio.
            good:
              - Every leaver's login and role memberships are gone within the time the Access Control Policy sets.
              - Movers keep only what the new job needs.
              - Logins with no matching person are listed, with what was decided.
            keep: The HR list matched to the logins removed
            shows:
              - The period and the instance it came from
              - The leave date and removal date for each person
          - platform: Databricks
            audience: Platform users
            where: The account console and workspace, Users and Groups.
            good:
              - Every leaver is removed from the workspace and its groups within the time the Access Control Policy sets.
              - Personal access tokens of leavers are revoked.
              - Movers keep only what the new job needs.
            keep: The HR list matched to the removals
            shows:
              - The period and the workspace it came from
              - The leave date and removal date for each person
          - platform: AWS
            audience: Platform users
            where: IAM, then the Credential report, and the IAM Identity Center users.
            good:
              - Every leaver's user, keys and assignments are gone within the time the Access Control Policy sets.
              - No leaver's key was used after the leave date.
              - Movers keep only what the new job needs.
            keep: The HR list matched to the credential report
            shows:
              - The period and the account it came from
              - The leave date and removal date for each person
    choosing_people:
      performer:
        - Gets HR events directly, not by word of mouth
        - Has rights to disable accounts in the directory and the systems outside it
        - Knows which systems have their own logins
      reviewer:
        - Doesn't do the removals
        - Can get the HR list independently of the person being checked
        - Can read sign-in logs, or knows who can pull them
      small_team: If one person does the removals and the matching, have the system owner check the HR count and a sample of removals.

  - id: AM-06
    title: Service accounts are owned and restricted
    why: >-
      Service accounts run jobs and connect systems, often with strong rights and passwords nobody
      changes. Giving each one an owner, a purpose and tight limits means someone notices when it is
      misused, and it gets closed when it is no longer needed.
    applies_when:
      - Applications, jobs, pipelines or integrations sign in with accounts that don't belong to a person.
    nature: preventive
    method: it_dependent
    frequency: event
    level: non-key
    owned_by: Application owner
    performed_by: Service account owner
    reviewed_by: Control owner
    theme: Service accounts
    categories: [application, database, operating_system, identity, cloud, jobs, engineering_tools]
    references:
      - label: "Worked example, part 1: a quarterly access review"
        link: /guides/worked-example-1-access-review/
    steps:
      - do: List every service account.
        how: >-
          Pull them from each system rather than from memory: directory accounts and managed service
          accounts, SQL logins used by applications, IAM users and roles, Entra service principals,
          Kubernetes and Databricks service principals. Include default and vendor-supplied accounts.
        evidence:
          keep: The service account list
          shows:
            - The date it was pulled and the systems it came from
            - Every account, with when its password was last set and when it was last used
        commands:
          - platform: Active Directory
            note: Group managed service accounts, then user accounts with a service principal name (usually service accounts).
            code: |
              Get-ADServiceAccount -Filter * | Select-Object Name, Enabled
              Get-ADUser -Filter "ServicePrincipalName -like '*'" -Properties ServicePrincipalName, PasswordLastSet, LastLogonTimestamp, Description |
                Select-Object SamAccountName, Enabled, PasswordLastSet, Description
          - platform: AWS
            note: IAM users in the account. The credential report (see AM-04) adds key age and last use.
            code: |
              aws iam list-users --query "Users[].[UserName,CreateDate,PasswordLastUsed]" --output table
          - platform: Kubernetes
            note: Service accounts in every namespace.
            code: |
              kubectl get serviceaccounts --all-namespaces
      - do: Name an owner and a purpose for each.
        how: >-
          Each account gets a named owner role and one line on what it does. An account nobody will own is
          a candidate for closing, and when an owner leaves, the account is reassigned or closed.
        evidence:
          keep: The list with an owner and purpose against each account
          shows:
            - An owner and a purpose on every line
            - The date and who confirmed them
      - do: Stop people signing in with them.
        how: >-
          Deny interactive and remote desktop sign-in for service accounts, and prefer identities with no
          password at all, such as group managed service accounts, managed identities and IAM roles.
          Default and vendor accounts have their passwords changed and are renamed or disabled where possible.
        evidence:
          keep: The sign-in restriction settings
          shows:
            - The date and the system, such as the Group Policy that denies sign-in
            - Which accounts it covers, and a reason for any it doesn't
      - do: Give each one only what its job needs.
        how: >-
          Compare each account's rights with its purpose and remove the rest. An account that needs
          administrator rights follows the privileged access control too.
        evidence:
          keep: Each account's permissions, checked against its purpose
          shows:
            - The date and the system
            - Rights removed, and a reason for any administrator rights kept
        commands:
          - platform: Kubernetes
            note: Everything a service account can do in a namespace. Replace <namespace> and <name>.
            code: |
              kubectl auth can-i --list --as=system:serviceaccount:<namespace>:<name> -n <namespace>
          - platform: AWS
            note: The policies attached to the role a workload uses. Replace <role name>.
            code: |
              aws iam list-attached-role-policies --role-name <role name>
              aws iam list-role-policies --role-name <role name>
      - do: Keep credentials in a vault and rotate them.
        how: >-
          Passwords and keys live in the vault, can't be read in clear text, and are rotated when someone
          who could reach them leaves. The Access Control Policy sets how often they are rotated otherwise.
        policy: "[Access Control Policy](#todo-access-control-policy)"
        evidence:
          keep: The vault entries and their rotation history
          shows:
            - The date and the vault it came from
            - Each account's last rotation, matched to the account list
      - do: Review the list regularly.
        how: >-
          Compare the accounts in the systems with the owned list, so new or forgotten ones turn up.
          Accounts with no owner, or unused for the period the Access Control Policy sets, are closed or
          given an owner and a reason.
        policy: "[Access Control Policy](#todo-access-control-policy)"
        evidence:
          keep: The comparison with a note on each account followed up
          shows:
            - Who reviewed it and when
            - The date and system of the list used, and the outcome for each unowned or unused account
      - do: Check it on each platform.
        how: >-
          For each platform, this says where to look, what good looks like and what to keep.
          Platform admins run the platform; Platform users own the controls over their own use.
        checks:
          - platform: Active Directory
            audience: Platform users
            where: Active Directory Users and Computers, the service accounts your systems use, and the group managed service accounts.
            good:
              - Every service account in the list has a named owner and a purpose.
              - Accounts with no owner are listed, with what was decided.
              - Each account is used only where the list says.
            keep: The service account list, compared with the directory
            shows:
              - The date and the domain it came from
              - Owner and purpose for each account
          - platform: Active Directory
            audience: Platform admins
            where: The membership of the privileged groups, and the logon restrictions on service accounts.
            good:
              - No service account is in a privileged group unless documented.
              - Service accounts can't sign in interactively.
              - Passwords are long and rotated, or the account is managed.
            keep: A dated export of the checks across all service accounts
            shows:
              - The date and the domain it came from
              - Any account that is an exception, with its reason
          - platform: SQL Server
            audience: Platform users
            where: Security, then Logins, for the accounts your applications use.
            good:
              - Every application login has a named owner and a purpose.
              - None is a member of sysadmin unless documented.
              - The login can reach only the databases its job needs.
            keep: The list of application logins with owners and rights
            shows:
              - The date and the instance it came from
              - Owner and purpose for each login
          - platform: AWS
            audience: Platform users
            where: IAM, then the users and roles your workloads use, and their access keys.
            good:
              - Every workload identity has a named owner and a purpose.
              - Each has only the policies its job needs.
              - Keys are rotated or replaced by roles, and unused ones are removed.
            keep: The list of workload identities with owners, rights and key dates
            shows:
              - The date and the account it came from
              - Owner and purpose for each identity
          - platform: Kubernetes
            audience: Platform users
            where: The service accounts and their role bindings in your namespaces.
            good:
              - Every service account has a named owner and a purpose.
              - Each can do only what its job needs.
              - Service accounts nobody uses are removed.
            keep: The list of service accounts with their permissions
            shows:
              - The date and the cluster it came from
              - Owner and purpose for each account
          - platform: Databricks
            audience: Platform users
            where: The account console, Service principals, and the tokens in the workspace.
            good:
              - Every service principal has a named owner and a purpose.
              - Each holds only the privileges its job needs.
              - Tokens belong to service principals, not to people, and old ones are removed.
            keep: The list of service principals with owners and privileges
            shows:
              - The date and the workspace it came from
              - Owner and purpose for each principal
    choosing_people:
      performer:
        - Owns the application or job the account serves
        - Knows what the account connects to and what would break without it
      reviewer:
        - Doesn't own or use the accounts being reviewed
        - Can read the directory, cloud or cluster to find accounts missing from the list
      small_team: If the owner is also the only reviewer, have the platform team compare their account list with yours and note the result.

  - id: AM-07
    title: Segregation of duties conflicts are prevented or monitored
    why: >-
      When one person can both do something and approve it, an error or a fraud can pass with no second
      look. Defining the conflicts, stopping them at the request and finding the ones that slip through
      keeps that second look in place.
    applies_when:
      - One person could both start and approve the same action, such as writing code and deploying it, or requesting and approving access.
      - Some people hold a second account, such as an admin account, alongside their everyday one.
    nature: preventive
    method: it_dependent
    frequency: event
    level: key
    owned_by: Head of Engineering
    performed_by: Access administrator
    reviewed_by: Control owner
    theme: Segregation of duties
    categories: [application, database, identity, cloud, engineering_tools]
    steps:
      - do: Write down the conflicting combinations.
        how: >-
          Start from the role documentation and list the pairs that one person must not hold, within one
          system and across systems, for example developing code and writing to production. Update it
          when roles change.
        evidence:
          keep: The conflict list
          shows:
            - Each conflicting pair and why it conflicts
            - The date and who agreed it
      - do: Check each request against the list.
        how: >-
          Before a grant is approved, check it against the person's existing access, including any second
          account they hold. Record the result on the request.
        evidence:
          keep: The conflict check recorded on each request
          shows:
            - The request, the result and who checked it
            - The date, before the grant
      - do: Decline a conflict, or put a mitigating review on it.
        how: >-
          A conflict is declined unless there is a real need. If it stays, a mitigating review names who
          does it, what they look at and when, and that person is not the one with the conflict.
        evidence:
          keep: The approved exception with its mitigating review
          shows:
            - The person, the conflict and the business reason
            - Who reviews it, what they look at and who approved the arrangement
      - do: Compare everyone's access with the list.
        how: >-
          Use the complete access lists from the periodic review and join people across systems by
          employee ID, so a second account under a different username still counts as the same person.
          The Access Control Policy sets how often this runs.
        policy: "[Access Control Policy](#todo-access-control-policy)"
        evidence:
          keep: The comparison and the conflicts it found
          shows:
            - The date and the access lists it used, with their counts
            - Each conflict found and what happened to it
        commands:
          - platform: Active Directory
            note: People in both of two conflicting groups (nested groups expanded). It won't catch a second account, so match those by employee ID. Replace the group names.
            code: |
              $a = Get-ADGroupMember -Identity "<group A>" -Recursive | Select-Object -ExpandProperty SamAccountName
              $b = Get-ADGroupMember -Identity "<group B>" -Recursive | Select-Object -ExpandProperty SamAccountName
              $a | Where-Object { $b -contains $_ }
      - do: Carry out the mitigating reviews.
        how: >-
          The named reviewer looks at what the person with the conflict actually did and investigates
          anything that wasn't approved. A mitigating review that never happens leaves the conflict open.
        evidence:
          keep: Each mitigating review
          shows:
            - Who reviewed it and when
            - The period and activity they looked at, and what they concluded
      - do: Check it on each platform.
        how: >-
          For each platform, this says where to look, what good looks like and what to keep.
          Platform admins run the platform; Platform users own the controls over their own use.
        checks:
          - platform: Active Directory
            audience: Platform users
            where: The members of the groups that grant the conflicting access, with nested groups expanded.
            good:
              - No one is in two conflicting groups, or each person who is has a mitigating review on file.
              - The mitigating reviews were carried out.
              - Second accounts held by one person are matched by employee ID.
            keep: The comparison of everyone's access with the conflict list
            shows:
              - The date and the domain it came from
              - Each conflict and its outcome
          - platform: SQL Server
            audience: Platform users
            where: Security, then Logins and the database role members, in SQL Server Management Studio.
            good:
              - No one holds two roles that conflict, such as changing data and approving it.
              - Each conflict has a documented decision.
              - The check covers developers with write access to production.
            keep: The comparison of role members with the conflict list
            shows:
              - The date and the instance it came from
              - Each conflict and its outcome
          - platform: GitHub Enterprise Server
            audience: Platform users
            where: Each repository's Settings, then Branches and Collaborators, in the organization.
            good:
              - No one can both write a change and approve it for production.
              - Production branches need a review by someone other than the author.
              - Each exception has a documented decision.
            keep: A dated export of the branch rules and the collaborators
            shows:
              - The date and the server it came from
              - Each exception and its outcome
    choosing_people:
      performer:
        - Grants access, so sees every request before it goes live
        - Understands which roles conflict and why
      reviewer:
        - Holds none of the conflicting access themselves
        - Can see access across systems, not just one
        - Has the standing to have a conflict removed
      small_team: If a small team can't avoid a conflict, have someone outside the team review that person's production activity and record it.

  - id: AM-08
    title: Authentication settings are enforced
    why: >-
      Access rules only help if people have to prove who they are. Single sign-on, multi-factor sign-in
      for the riskiest access and sound settings on the local accounts that remain make a stolen password
      much less useful, and keep each action tied to one person.
    applies_when:
      - People sign in to an application, database, server, cloud account or tool.
      - The system has local accounts that don't go through the firm's single sign-on.
    nature: preventive
    method: automated
    frequency: quarterly
    level: key
    owned_by: Application owner
    performed_by: Platform engineer
    reviewed_by: Control owner
    theme: Authentication
    categories: [application, database, operating_system, identity, cloud, engineering_tools]
    steps:
      - do: List how people sign in.
        how: >-
          For each system, note whether it uses the firm's single sign-on and list every local account
          that bypasses it, with the reason it exists. The local accounts are where weak passwords live.
        evidence:
          keep: The list of sign-in methods and local accounts
          shows:
            - The date and the system each came from
            - Every local account, with its reason
        commands:
          - platform: SQL Server
            note: SQL logins (the ones that don't use Windows sign-in), with whether password policy and expiry are enforced.
            code: |
              SELECT name, is_disabled, is_policy_checked, is_expiration_checked, create_date
              FROM sys.sql_logins
              ORDER BY name;
          - platform: Windows Server
            audience: Platform admins
            note: Local user accounts on a member server.
            code: |
              Get-LocalUser | Select-Object Name, Enabled, PasswordLastSet, LastLogon
          - platform: AWS
            note: The IAM credential report as CSV. Its password_enabled and mfa_active columns show who can sign in to the console and whether they use multi-factor sign-in.
            code: |
              aws iam generate-credential-report
              $b64 = aws iam get-credential-report --query Content --output text
              [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($b64)) | Out-File credential-report.csv
      - do: Move sign-in to single sign-on where the system supports it.
        how: >-
          Connect the system to Entra ID or Active Directory and make that the way people sign in.
          Every local account left after the move needs its reason written down.
        evidence:
          keep: The single sign-on settings
          shows:
            - The date and the system
            - That local sign-in is turned off, or the accounts still allowed
      - do: Require multi-factor sign-in for privileged and remote access.
        how: >-
          Administrator access and any access from outside the firm's network need a second factor,
          including remote access to servers, consoles and tools. In Entra ID this usually lives in
          Conditional Access policies.
        evidence:
          keep: The policies that require multi-factor sign-in
          shows:
            - The date, the system and the policy names
            - Which users and apps each policy covers, and any exclusions with a reason
        commands:
          - platform: Entra ID
            audience: Platform admins
            note: Conditional Access policies and whether each is on, off or report-only.
            code: |
              Get-MgIdentityConditionalAccessPolicy -All | Select-Object DisplayName, State, CreatedDateTime, ModifiedDateTime
      - do: Set password and lockout rules on the local accounts that remain.
        how: >-
          Password length, history, screening and lockout after repeated failures match the firm's
          password rules, and shared or anonymous sign-in is off. The Access Control Policy sets password
          expiry and how long an idle session lasts.
        policy: "[Access Control Policy](#todo-access-control-policy)"
        evidence:
          keep: An export of the password, lockout and session settings
          shows:
            - The date and the system
            - Each setting next to the firm's rule
        commands:
          - platform: Active Directory
            audience: Platform admins
            note: The domain password and lockout policy, then any fine-grained policies that override it.
            code: |
              Get-ADDefaultDomainPasswordPolicy
              Get-ADFineGrainedPasswordPolicy -Filter *
          - platform: Windows Server
            audience: Platform admins
            note: The local password and lockout policy on a server.
            code: |
              net accounts
      - do: Check the live settings against the intended ones.
        how: >-
          Export the live settings and compare them with what was set up. Fix or approve each
          difference. The Access Control Policy sets how often this runs.
        policy: "[Access Control Policy](#todo-access-control-policy)"
        evidence:
          keep: The live export and the comparison
          shows:
            - The date and the system of the export
            - Each difference and how it was resolved
      - do: Review changes to sign-in settings.
        how: >-
          Only a small named group can change authentication settings. Someone outside that group matches
          each logged change to an approved request.
        evidence:
          keep: The change log extract with a note on each change
          shows:
            - The period and the search that produced it, with its count
            - Who reviewed it, when and what they decided
      - do: Check it on each platform.
        how: >-
          For each platform, this says where to look, what good looks like and what to keep.
          Platform admins run the platform; Platform users own the controls over their own use.
        checks:
          - platform: SQL Server
            audience: Platform users
            where: Security, then Logins, in SQL Server Management Studio, or the query for this platform.
            good:
              - People sign in with Windows or single sign-on where the instance supports it.
              - The SQL logins that remain are listed, with an owner.
              - Password policy and expiry are on for each SQL login.
            keep: The login list with its policy settings
            shows:
              - The date and the instance it came from
              - Owner and reason for each SQL login
          - platform: Windows Server
            audience: Platform admins
            where: Local Security Policy on the server, then Account Policies, and Computer Management, then Local Users.
            good:
              - The local password and lockout rules match the intended settings.
              - Local accounts that remain are listed, with an owner.
              - Default accounts are renamed or disabled.
            keep: A dated export of the local policy and account list for each server
            shows:
              - The date and the server it came from
              - Any difference from the intended settings
          - platform: Active Directory
            audience: Platform admins
            where: Group Policy Management, the default domain policy, and any fine-grained password policies.
            good:
              - The domain's password and lockout rules match the intended settings.
              - Fine-grained policies that override them are listed and explained.
              - Changes to the policies went through change control.
            keep: A dated export of the domain policy
            shows:
              - The date and the domain it came from
              - Any difference from the intended settings
          - platform: Entra ID
            audience: Platform admins
            where: Entra admin center, then Protection, Conditional Access, and Authentication methods.
            good:
              - Multi-factor sign-in is on for administrators and for sign-in from outside the firm's network.
              - Legacy sign-in is blocked.
              - Every policy is on, not report-only, unless documented.
            keep: A dated export of the Conditional Access policies
            shows:
              - The date and the tenant it came from
              - The state of each policy
          - platform: AWS
            audience: Platform users
            where: IAM, then the Credential report, and the account's sign-in settings.
            good:
              - Every user who can sign in to the console has multi-factor sign-in active.
              - The root user has multi-factor sign-in.
              - Console users are in single sign-on where possible.
            keep: The credential report
            shows:
              - The date and the account it came from
              - The count of users with multi-factor sign-in on
          - platform: Databricks
            audience: Platform admins
            where: The account console, Security, then Single sign-on and user provisioning.
            good:
              - Sign-in goes through the firm's single sign-on.
              - Multi-factor sign-in is set where the identity provider supports it.
              - Local accounts that remain are listed, with an owner.
            keep: A dated export of the sign-in settings
            shows:
              - The date and the account it came from
              - Any local account, with its owner
          - platform: Kubernetes
            audience: Platform admins
            where: The cluster's authentication settings, and how people get a credential.
            good:
              - People sign in through the firm's single sign-on, not shared certificates.
              - Credentials that outlive a person are not in use.
              - Anonymous access is off.
            keep: A dated export of the authentication settings
            shows:
              - The date and the cluster it came from
              - Any exception, with its reason
          - platform: GitHub Enterprise Server
            audience: Platform admins
            where: Site admin, then Authentication, and the list of local accounts.
            good:
              - Sign-in goes through single sign-on.
              - Local accounts that remain are listed, with an owner.
              - Multi-factor sign-in is on for site administrators.
            keep: A dated export of the authentication settings
            shows:
              - The date and the server it came from
              - Any local account, with its owner
          - platform: VPN
            audience: Platform admins
            where: The VPN's sign-in settings, and the identity provider it uses.
            good:
              - Remote sign-in needs multi-factor sign-in.
              - Sign-in uses the firm's single sign-on.
              - Local VPN accounts are listed, with an owner.
            keep: A dated export of the sign-in settings
            shows:
              - The date and the VPN it came from
              - Any local account, with its owner
    choosing_people:
      performer:
        - Administers the identity platform or the system's sign-in settings
        - Knows which local accounts exist and why
      reviewer:
        - Can't change authentication settings themselves
        - Knows enough to tell whether an exclusion from multi-factor sign-in is justified
      small_team: If everyone who could review can also change the settings, have the platform team or another team review the change log.
